<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>네일 톤보정</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F8">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --line:#E4E4E8; --line-soft:#F1F1F3;
  --ink:#1B1B1F; --ink-soft:#63636A; --ink-mute:#9B9BA1;
  --accent:#232327; --accent-deep:#000000; --accent-soft:#F0F0F2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:30;background:rgba(247,247,248,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px;
}
header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px}
header .sub{font-size:11px;color:var(--ink-mute);margin-left:auto}
main{padding:12px 14px 40px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 10px;letter-spacing:.2px}
/* empty state */
#empty{margin-top:26vh;text-align:center;padding:0 24px}
#empty .emo{font-size:40px}
#empty p{color:var(--ink-soft);font-size:14px;margin:10px 0 20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:600;
  background:var(--accent);color:#fff;cursor:pointer;letter-spacing:-.2px;
}
.btn:active{background:var(--accent-deep)}
.btn.ghost{background:var(--card);color:var(--accent-deep);border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
/* stage */
#stageWrap{position:relative;border-radius:16px;overflow:hidden;background:#EBEBEE;border:1px solid var(--line-soft)}
#view{display:block;width:100%;height:auto;touch-action:none}
#holdHint{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  background:rgba(27,27,31,.6);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;
  pointer-events:none;opacity:.85;transition:opacity .15s;white-space:nowrap;
}
#cmpBadge{
  position:absolute;top:10px;left:10px;background:rgba(27,27,31,.65);color:#fff;
  font-size:11px;padding:4px 10px;border-radius:20px;display:none;pointer-events:none;
}
/* filmstrip */
#strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;-webkit-overflow-scrolling:touch}
#strip .thumb{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:10px;overflow:hidden;border:2px solid transparent}
#strip .thumb.on{border-color:var(--accent)}
#strip .thumb img{width:100%;height:100%;object-fit:cover;display:block}
#strip .thumb .x{
  position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;
  background:rgba(27,27,31,.7);color:#fff;font-size:10px;line-height:16px;text-align:center;border:none;padding:0;
}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:22px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;letter-spacing:-.2px;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.presetName{font-size:14px;font-weight:700;letter-spacing:-.2px}
.presetDesc{font-size:12px;color:var(--ink-mute);margin-top:2px}
/* sliders */
.sl{margin:13px 0 2px}
.sl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.sl label{font-size:13px;font-weight:600;color:var(--ink)}
.sl .val{font-size:11px;color:var(--ink-mute);font-variant-numeric:tabular-nums}
.sl .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-mute);margin-top:2px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#DEDEE2}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#232327;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.22);margin-top:-9px;
}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#232327;border:2px solid #fff}
/* export */
.seg{display:flex;background:var(--line-soft);border-radius:11px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(36,35,43,.1)}
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
  background:rgba(27,27,31,.9);color:#fff;font-size:13px;padding:10px 18px;border-radius:22px;
  opacity:0;transition:all .25s;pointer-events:none;z-index:50;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rowbtns{display:flex;gap:8px;margin-top:4px}
.rowbtns .btn{flex:1}
.hint{font-size:11px;color:var(--ink-mute);margin-top:8px}
#busy{position:fixed;inset:0;background:rgba(247,247,248,.75);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;font-size:14px;color:var(--ink-soft);flex-direction:column;gap:10px}
#busy .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:#232327;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>📸 네일 톤보정</h1>
  <span class="sub">nail from jeje</span>
</header>

<main>
  <div id="empty">
    <div class="emo">💅</div>
    <p>시술 사진을 고르면<br>자연광 감성으로 톤을 맞춰 드려요</p>
    <button class="btn" id="pick0">사진 선택하기</button>
    <p class="hint" style="margin-top:14px">여러 장 선택 → 같은 톤으로 한꺼번에 보정</p>
  </div>

  <div id="editor" style="display:none">
    <div id="stageWrap">
      <canvas id="view"></canvas>
      <div id="cmpBadge">원본</div>
      <div id="holdHint">꾹 누르면 원본 · 드래그로 위치 · 두 손가락으로 확대</div>
    </div>
    <div id="strip"></div>

    <div class="card">
      <div class="chips" id="presetChips"></div>
      <div style="margin-top:10px" id="presetInfo"></div>
    </div>

    <div class="card">
      <h2>미세 조절</h2>
      <div id="sliders"></div>
      <div class="hint">100으로 올려도 과하지 않게 최대치를 제한해 두었어요.</div>
    </div>

    <div class="card">
      <h2>비율 자르기</h2>
      <div class="chips" id="ratioChips"></div>
      <div class="hint">드래그로 위치를 옮기고, 두 손가락(또는 더블탭)으로 확대해 보세요.</div>
    </div>

    <div class="card">
      <h2>워터마크</h2>
      <div class="chips" id="wmChips"></div>
    </div>

    <div class="card">
      <h2>저장</h2>
      <div class="seg" id="fmtSeg">
        <button data-f="jpg" class="on">고화질 JPG</button>
        <button data-f="png">PNG</button>
      </div>
      <div class="rowbtns">
        <button class="btn" id="saveOne">이 사진 저장</button>
      </div>
      <div class="rowbtns">
        <button class="btn ghost" id="saveAll">전체 저장 (<span id="nAll">0</span>장)</button>
        <button class="btn ghost" id="addMore">사진 추가</button>
      </div>
      <div class="rowbtns">
        <button class="btn ghost small" id="cmpBtn" style="flex:1">원본 비교</button>
        <button class="btn ghost small" id="resetSl" style="flex:1">수정 초기화</button>
      </div>
      <div class="hint">아이폰은 [이 사진 저장] 누르면 공유 시트가 열려요 — "사진 앱에 저장"을 고르면 됩니다.</div>
    </div>
  </div>
</main>

<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyMsg">보정 중…</div></div>
<input type="file" id="file" accept="image/*" multiple style="display:none">

<script>
'use strict';
window.__errs=[];
window.addEventListener('error',e=>window.__errs.push(String(e.message||e)));
window.addEventListener('unhandledrejection',e=>window.__errs.push('rej:'+String(e.reason&&e.reason.message||e.reason)));

const $=s=>document.querySelector(s);
const view=$('#view'), vctx=view.getContext('2d',{willReadFrequently:true});
const WORK_MAX=1800, PREVIEW_MAX=960;

/* ---------- presets (tuned to reference IMG_9088 cream daylight tone) ---------- */
const SLIDER_DEFS=[
  ['exp','밝기',-100,100],['con','대비',-100,100],['hi','하이라이트',-100,100],['sh','그림자',-100,100],
  ['temp','색온도',-100,100],['tint','틴트',-100,100],['sat','채도',-100,100],
  ['sharp','선명도',0,100],['skin','피부결 정리',0,100],['k','강도',0,100]
];
const ZERO={exp:0,con:0,hi:0,sh:0,temp:0,tint:0,sat:0,sharp:0,skin:0,k:100};
const PRESETS={
  cream:{name:'크림 자연광 ★기본',desc:'참고 사진 톤 — 맑은 크림빛 자연광, 그림자 리프트, 노란·초록끼 중화',
    v:{exp:12,con:-10,hi:-12,sh:30,temp:18,tint:8,sat:-6,sharp:22,skin:25,k:100}},
  beige:{name:'포근 베이지',desc:'따뜻한 밀키 뉴트럴, 차분한 무드',
    v:{exp:8,con:-14,hi:-16,sh:36,temp:30,tint:5,sat:-10,sharp:16,skin:30,k:100}},
  syrup:{name:'여리 시럽',desc:'화사한 파스텔·시럽네일 강조, 피부톤 화사하게',
    v:{exp:18,con:-8,hi:-10,sh:26,temp:12,tint:12,sat:6,sharp:18,skin:30,k:100}},
  art:{name:'선명 아트',desc:'글리터·드로잉·마그네틱 디테일 살리기',
    v:{exp:10,con:14,hi:-6,sh:16,temp:4,tint:0,sat:14,sharp:48,skin:10,k:100}},
  chart:{name:'아트판 화이트',desc:'팁판·차트판용 깨끗한 뉴트럴 화이트',
    v:{exp:16,con:-4,hi:-8,sh:22,temp:2,tint:4,sat:-14,sharp:26,skin:15,k:100}},
  orig:{name:'원본',desc:'보정 없이 그대로',
    v:{exp:0,con:0,hi:0,sh:0,temp:0,tint:0,sat:0,sharp:0,skin:0,k:100}}
};
const RATIOS=[['orig','원본'],['45','4:5 (인스타 피드)'],['11','1:1 (정방형)']];
const WMS=[['off','끔'],['tag','@nail_from.jeje'],['name','nail from jeje']];

/* ---------- state ---------- */
const st={
  imgs:[], cur:0, preset:'cream',
  p:Object.assign({},PRESETS.cream.v),
  ratio:'orig', wm:'off', fmt:'jpg',
  cmp:false, procCache:null, procKey:''
};

/* ---------- image loading ---------- */
function loadImageFile(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(url),4000)};
    im.onerror=()=>rej(new Error('이미지를 읽을 수 없어요'));
    im.src=url;
  });
}
function fitCanvas(src,max){
  const w=src.width,h=src.height;
  const s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}
async function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));
  if(!list.length){toast('사진 파일을 골라 주세요');return}
  busy('사진 불러오는 중…');
  try{
    for(const f of list){
      const im=await loadImageFile(f);
      st.imgs.push({name:f.name.replace(/\.[^.]+$/,'')||'photo',full:fitCanvas(im,WORK_MAX),view:{z:1,x:.5,y:.5}});
    }
  }catch(e){toast(e.message)}
  busy(false);
  st.cur=st.imgs.length-1;
  refreshEditor();
  if(list.length>1) toast(list.length+'장 불러왔어요 — 같은 톤이 모두에 적용돼요');
}
function curImg(){return st.imgs[st.cur]}

/* ---------- processing core ---------- */
function boxBlurF(src,dst,tmp,w,h,r){
  // horizontal -> tmp, vertical -> dst (separable box, clamped window)
  const n=2*r+1;
  for(let y=0;y<h;y++){
    const row=y*w;
    let sum=0;
    for(let x=-r;x<=r;x++) sum+=src[row+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){
      tmp[row+x]=sum/n;
      const xa=Math.min(w-1,x+r+1), xb=Math.max(0,x-r);
      sum+=src[row+xa]-src[row+xb];
    }
  }
  for(let x=0;x<w;x++){
    let sum=0;
    for(let y=-r;y<=r;y++) sum+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){
      dst[y*w+x]=sum/n;
      const ya=Math.min(h-1,y+r+1), yb=Math.max(0,y-r);
      sum+=tmp[ya*w+x]-tmp[yb*w+x];
    }
  }
}
// half-res guided smoothing base (edge preserving), guide = luma
function smoothBase(data,w,h,amt){
  // returns {base:[Float32 x3] full-res} or null
  const w2=(w+1)>>1, h2=(h+1)>>1, n2=w2*h2;
  const R=new Float32Array(n2),G=new Float32Array(n2),B=new Float32Array(n2),I=new Float32Array(n2);
  for(let y=0;y<h2;y++){
    const y0=2*y, y1=Math.min(h-1,y0+1);
    for(let x=0;x<w2;x++){
      const x0=2*x, x1=Math.min(w-1,x0+1);
      const a=(y0*w+x0)<<2,b=(y0*w+x1)<<2,c=(y1*w+x0)<<2,d=(y1*w+x1)<<2;
      const i=y*w2+x;
      const r=(data[a]+data[b]+data[c]+data[d])/1020, g=(data[a+1]+data[b+1]+data[c+1]+data[d+1])/1020, bl=(data[a+2]+data[b+2]+data[c+2]+data[d+2])/1020;
      R[i]=r;G[i]=g;B[i]=bl;I[i]=.299*r+.587*g+.114*bl;
    }
  }
  const rh=Math.max(3,Math.min(14,Math.round(Math.min(w2,h2)*0.02)));
  const eps=0.008+0.012*(1-amt);
  const tmp=new Float32Array(n2);
  const mI=new Float32Array(n2),mII=new Float32Array(n2);
  boxBlurF(I,mI,tmp,w2,h2,rh);
  for(let i=0;i<n2;i++) mII[i]=I[i]*I[i];
  const tII=new Float32Array(n2); boxBlurF(mII,tII,tmp,w2,h2,rh);
  const out=[new Float32Array(n2),new Float32Array(n2),new Float32Array(n2)];
  const chans=[R,G,B], mC=new Float32Array(n2), mIC=new Float32Array(n2), tC=new Float32Array(n2),
        aA=new Float32Array(n2), bB=new Float32Array(n2), tA=new Float32Array(n2), tB=new Float32Array(n2);
  for(let c=0;c<3;c++){
    const C=chans[c];
    boxBlurF(C,mC,tmp,w2,h2,rh);
    for(let i=0;i<n2;i++) mIC[i]=I[i]*C[i];
    boxBlurF(mIC,tC,tmp,w2,h2,rh);
    for(let i=0;i<n2;i++){
      const vI=tII[i]-mI[i]*mI[i];
      const cov=tC[i]-mI[i]*mC[i];
      const a=cov/(vI+eps);
      aA[i]=a; bB[i]=mC[i]-a*mI[i];
    }
    boxBlurF(aA,tA,tmp,w2,h2,rh);
    boxBlurF(bB,tB,tmp,w2,h2,rh);
    for(let i=0;i<n2;i++) out[c][i]=tA[i]*I[i]+tB[i];
  }
  // upsample bilinear to full res
  const fR=new Float32Array(w*h),fG=new Float32Array(w*h),fB=new Float32Array(w*h);
  const fl=[fR,fG,fB];
  for(let c=0;c<3;c++){
    const S=out[c],D=fl[c];
    for(let y=0;y<h;y++){
      const fy=Math.min(h2-1,Math.max(0,(y-0.5)*0.5));
      const y0=Math.floor(fy), y1=Math.min(h2-1,y0+1), wy=fy-y0;
      const r0=y0*w2, r1=y1*w2, dr=y*w;
      for(let x=0;x<w;x++){
        const fx=Math.min(w2-1,Math.max(0,(x-0.5)*0.5));
        const x0=Math.floor(fx), x1=Math.min(w2-1,x0+1), wx=fx-x0;
        D[dr+x]=S[r0+x0]*(1-wx)*(1-wy)+S[r0+x1]*wx*(1-wy)+S[r1+x0]*(1-wx)*wy+S[r1+x1]*wx*wy;
      }
    }
  }
  return [fR,fG,fB];
}
function renderTo(srcCanvas,p,maxSize){
  const w0=srcCanvas.width,h0=srcCanvas.height;
  const s=Math.min(1,maxSize/Math.max(w0,h0));
  const w=Math.round(w0*s),h=Math.round(h0*s);
  const off=document.createElement('canvas'); off.width=w; off.height=h;
  const octx=off.getContext('2d',{willReadFrequently:true});
  octx.drawImage(srcCanvas,0,0,w,h);
  const img=octx.getImageData(0,0,w,h), data=img.data, N=w*h;
  const k=p.k/100;
  const exp=p.exp*k/100, con=p.con*k/100, hi=p.hi*k/100, sh=p.sh*k/100,
        temp=p.temp*k/100, tint=p.tint*k/100, sat=p.sat*k/100,
        sharp=p.sharp/100*k, skin=p.skin/100*k;
  // smoothing base
  let base=null;
  if(skin>0.003){ try{ base=smoothBase(data,w,h,skin); }catch(e){ window.__errs.push('smooth:'+e.message); base=null; } }
  // luma + detail magnitude for detail gate
  let dm=null, lum=null;
  if(base){
    lum=new Float32Array(N); dm=new Float32Array(N);
    for(let i=0;i<N;i++){
      const o=i<<2;
      const L=(.299*data[o]+.587*data[o+1]+.114*data[o+2])/255;
      lum[i]=L;
      const Lb=.299*base[0][i]+.587*base[1][i]+.114*base[2][i];
      dm[i]=Math.abs(L-Lb);
    }
    // blur dm (radius 2) to get local detail energy
    const t1=new Float32Array(N),t2=new Float32Array(N),t3=new Float32Array(N);
    boxBlurF(dm,t1,t2,w,h,2);
    boxBlurF(t1,t3,t2,w,h,2);
    dm=t3;
  }
  const detailGate=new Float32Array(N), skinP=new Float32Array(N);
  if(base){
    for(let i=0;i<N;i++){
      const o=i<<2;
      const r=data[o]/255,g=data[o+1]/255,b=data[o+2]/255;
      const Cb=128-0.168736*r*255-0.331264*g*255+0.5*b*255;
      const Cr=128+0.5*r*255-0.418688*g*255-0.081312*b*255;
      const pCr=Math.exp(-Math.pow((Cr-145)/18,2)), pCb=Math.exp(-Math.pow((Cb-112)/16,2));
      skinP[i]=pCr*pCb;
      const gate=1-Math.min(1,dm[i]/0.055);
      detailGate[i]=skinP[i]*gate*(skin*0.85);
    }
  }
  // sharpen buffer: small blur of current result (computed after color? apply before color for stability)
  // color pass
  const out=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const o=i<<2, t=i*3;
    let r,g,b;
    if(base){
      const wgt=detailGate[i];
      r=data[o]/255+((base[0][i]-data[o]/255)*wgt);
      g=data[o+1]/255+((base[1][i]-data[o+1]/255)*wgt);
      b=data[o+2]/255+((base[2][i]-data[o+2]/255)*wgt);
    }else{
      r=data[o]/255; g=data[o+1]/255; b=data[o+2]/255;
    }
    // brightness (additive)
    r+=exp*0.0035; g+=exp*0.0035; b+=exp*0.0035;
    // temperature & tint (multiplicative gains)
    r*=1+0.10*temp; g*=1-0.02*temp-0.06*tint; b*=1-0.12*temp+0.04*tint; r*=1+0.02*tint;
    // shadows / highlights via luma masks (hue preserving factor)
    let l=.299*r+.587*g+.114*b;
    let f=1;
    if(sh>0) f+=sh*0.9*Math.pow(1-Math.min(1,Math.max(0,l)),2);
    else if(sh<0) f+=sh*0.6*Math.pow(1-l,2);
    if(hi>0) f+=hi*0.5*l*l;        // hi>0: 더 밝게
    else if(hi<0) f-=-hi*0.45*l*l; // hi<0: 하이라이트 눌러 보호
    r*=f; g*=f; b*=f;
    // contrast
    const cc=1+con*0.9;
    r=(r-0.5)*cc+0.5; g=(g-0.5)*cc+0.5; b=(b-0.5)*cc+0.5;
    // saturation / vibrance
    l=.299*r+.587*g+.114*b;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const sCur=mx>0?(mx-mn)/mx:0;
    let sf;
    if(sat>=0) sf=1+sat*0.9*(1-sCur);
    else sf=1+sat*0.9;
    r=l+(r-l)*sf; g=l+(g-l)*sf; b=l+(b-l)*sf;
    out[t]=r; out[t+1]=g; out[t+2]=b;
  }
  // sharpen (unsharp, thresholded, nail details preserved)
  if(sharp>0.004){
    const L=new Float32Array(N), t1=new Float32Array(N), t2=new Float32Array(N), t3=new Float32Array(N);
    for(let i=0;i<N;i++) L[i]=.299*out[i*3]+.587*out[i*3+1]+.114*out[i*3+2];
    boxBlurF(L,t1,t2,w,h,1); boxBlurF(t1,t3,t2,w,h,1);
    const amt=sharp*0.9;
    for(let i=0;i<N;i++){
      const d=L[i]-t3[i];
      if(Math.abs(d)>0.004){
        const add=d*amt;
        out[i*3]+=add; out[i*3+1]+=add; out[i*3+2]+=add;
      }
    }
  }
  // write back
  for(let i=0;i<N;i++){
    const o=i<<2,t=i*3;
    data[o]=Math.max(0,Math.min(255,out[t]*255));
    data[o+1]=Math.max(0,Math.min(255,out[t+1]*255));
    data[o+2]=Math.max(0,Math.min(255,out[t+2]*255));
    data[o+3]=255;
  }
  octx.putImageData(img,0,0);
  return off;
}
function paramsKey(p){return SLIDER_DEFS.map(d=>d[0]).map(n=>n+':'+p[n]).join('|')}
function processedFor(img,preKey,max){
  const key=preKey+'@'+max;
  if(img._proc&&img._procKey===key) return img._proc;
  const c=renderTo(img.full,st.p,max);
  img._proc=c; img._procKey=key;
  return c;
}
function origPreviewFor(img){
  if(!img._orig) img._orig=fitCanvas(img.full,PREVIEW_MAX);
  return img._orig;
}

/* ---------- crop view ---------- */
function cropRect(img){
  const W=img._proc.width, H=img._proc.height;
  let cw,ch;
  if(st.ratio==='orig'){ return {x:0,y:0,w:W,h:H}; }
  const r=st.ratio==='45'?4/5:1;
  if(W/H>r){ ch=H; cw=H*r; } else { cw=W; ch=W/r; }
  const z=img.view.z;
  cw/=z; ch/=z;
  let cx=img.view.x*W, cy=img.view.y*H;
  cx=Math.max(cw/2,Math.min(W-cw/2,cx));
  cy=Math.max(ch/2,Math.min(H-ch/2,cy));
  return {x:cx-cw/2,y:cy-ch/2,w:cw,h:ch};
}
function drawWatermark(ctx,w,h,text){
  const size=Math.max(11,Math.round(w*0.032));
  ctx.save();
  ctx.font='500 '+size+'px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif';
  ctx.textBaseline='alphabetic';
  const tracking=size*0.14;
  let tw=0; for(const ch of text) tw+=ctx.measureText(ch).width+tracking;
  tw-=tracking;
  const m=Math.round(w*0.045), x=w-m-tw, y=h-m;
  // sample bg luma under text
  const gx=Math.max(0,x-4), gy=Math.max(0,y-size-4), gw=Math.min(w-gx,tw+8), gh=Math.min(h-gy,size+8);
  let sum=0,n=0;
  try{
    const d=ctx.getImageData(gx,gy,Math.max(1,gw),Math.max(1,gh)).data;
    for(let i=0;i<d.length;i+=64){ sum+=.299*d[i]+.587*d[i+1]+.114*d[i+2]; n++; }
  }catch(e){}
  const bright=(n?sum/n:200)>150;
  ctx.fillStyle=bright?'rgba(70,64,84,0.5)':'rgba(255,255,255,0.8)';
  ctx.shadowColor=bright?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.35)';
  ctx.shadowBlur=size*0.25;
  let cx2=x;
  for(const ch of text){ ctx.fillText(ch,cx2,y); cx2+=ctx.measureText(ch).width+tracking; }
  ctx.restore();
}
function renderPreview(){
  const img=curImg(); if(!img) return;
  const proc=processedFor(img,paramsKey(st.p),PREVIEW_MAX);
  const rect=cropRect(img);
  const wrap=$('#stageWrap');
  const cssW=Math.min(wrap.clientWidth||390,520);
  const dispH=Math.round(cssW*rect.h/rect.w);
  const maxH=Math.round(window.innerHeight*0.56);
  const scale=Math.min(1,maxH/dispH);
  const dpr=Math.min(2.5,window.devicePixelRatio||1);
  view.width=Math.round(cssW*scale*dpr); view.height=Math.round(dispH*scale*dpr);
  view.style.height=(dispH*scale)+'px';
  vctx.setTransform(dpr,0,0,dpr,0,0);
  vctx.imageSmoothingQuality='high';
  const dw=cssW*scale, dh=dispH*scale;
  if(st.cmp){
    const orig=origPreviewFor(img);
    const sc=orig.width/proc.width;
    vctx.drawImage(orig,rect.x*sc,rect.y*sc,rect.w*sc,rect.h*sc,0,0,dw,dh);
    $('#cmpBadge').style.display='block';
  }else{
    vctx.drawImage(proc,rect.x,rect.y,rect.w,rect.h,0,0,dw,dh);
    $('#cmpBadge').style.display='none';
    if(st.wm!=='off') drawWatermark(vctx,dw,dh,st.wm==='tag'?'@nail_from.jeje':'nail from jeje');
  }
}

/* ---------- pointer interaction (pan / pinch / hold-compare) ---------- */
const ptrs=new Map();
let holdTimer=null, pinch0=0, z0=1, moved=false;
function cancelHold(){ if(holdTimer){clearTimeout(holdTimer);holdTimer=null} }
view.addEventListener('pointerdown',e=>{
  if(!curImg())return;
  view.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  moved=false; cancelHold();
  $('#holdHint').style.opacity='0';
  if(ptrs.size===1){
    holdTimer=setTimeout(()=>{st.cmp=true;renderPreview()},280);
  }else if(ptrs.size===2){
    cancelHold(); st.cmp=false;
    const p=[...ptrs.values()];
    pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); z0=curImg().view.z;
  }
});
view.addEventListener('pointermove',e=>{
  const img=curImg(); if(!img||!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId);
  const dx=e.offsetX-prev.x, dy=e.offsetY-prev.y;
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(!moved&&Math.hypot(dx,dy)>6){moved=true;cancelHold();if(st.cmp){st.cmp=false;renderPreview()}}
  if(ptrs.size===1&&moved){
    const rect=cropRect(img);
    const scaleX=rect.w/view.clientWidth;
    img.view.x+=dx*scaleX/img._proc.width;
    img.view.y+=dy*scaleX/img._proc.height;
    img.view.x=Math.max(0,Math.min(1,img.view.x));
    img.view.y=Math.max(0,Math.min(1,img.view.y));
    renderPreview();
  }else if(ptrs.size===2){
    const p=[...ptrs.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinch0>0){ img.view.z=Math.max(1,Math.min(4,z0*d/pinch0)); renderPreview(); }
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId); cancelHold();
  if(st.cmp){st.cmp=false;renderPreview()}
}
view.addEventListener('pointerup',endPtr);
view.addEventListener('pointercancel',endPtr);
view.addEventListener('dblclick',()=>{const img=curImg();if(!img)return;img.view.z=img.view.z>1.2?1:2;renderPreview()});

/* ---------- UI build ---------- */
function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),ms||2200); }
function busy(on,msg){ const b=$('#busy'); if(!on){b.style.display='none';return} $('#busyMsg').textContent=msg||'보정 중…'; b.style.display='flex'; }

// presets
const pchips=$('#presetChips');
for(const [id,pr] of Object.entries(PRESETS)){
  const b=document.createElement('button');
  b.className='chip'+(id===st.preset?' on':''); b.textContent=pr.name; b.dataset.id=id;
  b.onclick=()=>{
    st.preset=id;
    Object.assign(st.p,pr.v);
    syncSliders();
    pchips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
    showPresetInfo(); invalidate(); renderPreview();
  };
  pchips.appendChild(b);
}
function showPresetInfo(){
  const pr=PRESETS[st.preset];
  $('#presetInfo').innerHTML=pr?'<div class="presetName">'+pr.name+'</div><div class="presetDesc">'+pr.desc+'</div>':'';
}
// ratios
const rchips=$('#ratioChips');
for(const [id,label] of RATIOS){
  const b=document.createElement('button'); b.className='chip'+(id===st.ratio?' on':''); b.textContent=label; b.dataset.id=id;
  b.onclick=()=>{ st.ratio=id; rchips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); renderPreview(); };
  rchips.appendChild(b);
}
// watermark
const wchips=$('#wmChips');
for(const [id,label] of WMS){
  const b=document.createElement('button'); b.className='chip'+(id===st.wm?' on':''); b.textContent=label; b.dataset.id=id;
  b.onclick=()=>{ st.wm=id; wchips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===id)); renderPreview(); };
  wchips.appendChild(b);
}
// sliders
const slWrap=$('#sliders'); const inputs={};
for(const [key,label,mn,mx] of SLIDER_DEFS){
  const d=document.createElement('div'); d.className='sl';
  let extra='';
  if(key==='temp') extra='<div class="ends"><span>시원</span><span>따뜻</span></div>';
  if(key==='tint') extra='<div class="ends"><span>초록끼 제거</span><span>마젠타</span></div>';
  d.innerHTML='<div class="row"><label>'+label+'</label><span class="val"></span></div>';
  const inp=document.createElement('input');
  inp.type='range'; inp.min=mn; inp.max=mx; inp.step=1; inp.value=st.p[key];
  const val=d.querySelector('.val');
  const upd=()=>{ const v=st.p[key]; val.textContent=(v>0&&['exp','con','hi','sh','temp','tint','sat'].includes(key)?'+':'')+v; };
  inp._upd=upd;
  inp.addEventListener('input',()=>{
    st.p[key]=+inp.value; upd();
    if(['exp','con','hi','sh','temp','tint','sat','sharp','skin'].includes(key)){ st.preset='custom'; pchips.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); showPresetInfo(); }
    invalidate(); schedulePreview();
  });
  upd();
  d.appendChild(inp); if(extra) d.insertAdjacentHTML('beforeend',extra);
  slWrap.appendChild(d); inputs[key]=inp;
}
function syncSliders(){ for(const [key] of SLIDER_DEFS){ inputs[key].value=st.p[key]; inputs[key]._upd(); } }
$('#resetSl').onclick=()=>{
  st.preset=PRESETS[st.preset]?st.preset:'cream';
  Object.assign(st.p,PRESETS[st.preset].v);
  syncSliders();
  pchips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===st.preset));
  showPresetInfo(); invalidate(); renderPreview();
  toast('프리셋 값으로 되돌렸어요');
};

let rafId=null;
function schedulePreview(){ if(rafId)return; rafId=requestAnimationFrame(()=>{rafId=null;renderPreview()}); }
function invalidate(){ st.imgs.forEach(im=>im._procKey=null); }

// format segment
$('#fmtSeg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{ st.fmt=b.dataset.f; $('#fmtSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); };
});

/* ---------- export ---------- */
function busyDelay(ms){return new Promise(r=>setTimeout(r,ms))}
async function exportOne(img,idx,label){
  const proc=renderTo(img.full,st.p,WORK_MAX);
  img._proc=proc; img._procKey=paramsKey(st.p)+'@'+WORK_MAX;
  const rect=cropRect(img);
  const out=document.createElement('canvas');
  out.width=Math.round(rect.w); out.height=Math.round(rect.h);
  const c=out.getContext('2d');
  c.imageSmoothingQuality='high';
  c.drawImage(proc,rect.x,rect.y,rect.w,rect.h,0,0,out.width,out.height);
  if(st.wm!=='off') drawWatermark(c,out.width,out.height,st.wm==='tag'?'@nail_from.jeje':'nail from jeje');
  const mime=st.fmt==='png'?'image/png':'image/jpeg';
  const blob=await new Promise(r=>out.toBlob(r,mime,st.fmt==='png'?undefined:0.92));
  const fname='nail_'+(label||'')+(idx!=null?('_'+(idx+1)):'')+'.'+(st.fmt==='png'?'png':'jpg');
  const file=new File([blob],fname,{type:mime});
  // iOS: share sheet lets "사진 앱에 저장"; else download
  let shared=false;
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]}); shared=true;
    }
  }catch(e){ if(e&&e.name==='AbortError') throw new Error('사용자가 취소했어요'); }
  if(!shared){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
  }
}
$('#saveOne').onclick=async()=>{
  const img=curImg(); if(!img)return;
  busy('고화질로 만드는 중…');
  try{ await exportOne(img,st.cur,img.name); toast('저장했어요 💛'); }
  catch(e){ toast(e.message); }
  busy(false);
};
$('#saveAll').onclick=async()=>{
  if(st.imgs.length<1)return;
  busy('1/'+st.imgs.length+' 장 저장 중…');
  let ok=0;
  for(let i=0;i<st.imgs.length;i++){
    $('#busyMsg').textContent=(i+1)+'/'+st.imgs.length+' 장 저장 중…';
    try{ await exportOne(st.imgs[i],i,st.imgs[i].name); ok++; }
    catch(e){ toast(e.message); break; }
    await busyDelay(i<st.imgs.length-1?500:0);
  }
  busy(false);
  if(ok) toast(ok+'장 저장했어요 💛');
};

/* ---------- editor refresh ---------- */
function refreshEditor(){
  const has=st.imgs.length>0;
  $('#empty').style.display=has?'none':'';
  $('#editor').style.display=has?'':'none';
  if(!has)return;
  const strip=$('#strip'); strip.innerHTML='';
  st.imgs.forEach((im,i)=>{
    const t=document.createElement('div'); t.className='thumb'+(i===st.cur?' on':'');
    const th=document.createElement('canvas'); th.width=104; th.height=104;
    const tc=th.getContext('2d');
    const s=Math.max(104/im.full.width,104/im.full.height);
    tc.drawImage(im.full,(im.full.width-104/s)/2,(im.full.height-104/s)/2,104/s,104/s,0,0,104,104);
    t.appendChild(th);
    const x=document.createElement('button'); x.className='x'; x.textContent='✕';
    x.onclick=ev=>{ev.stopPropagation();st.imgs.splice(i,1);if(st.cur>=st.imgs.length)st.cur=Math.max(0,st.imgs.length-1);invalidate();refreshEditor();};
    t.appendChild(x);
    t.onclick=()=>{st.cur=i;refreshEditor();};
    strip.appendChild(t);
  });
  $('#nAll').textContent=st.imgs.length;
  showPresetInfo();
  renderPreview();
}
$('#pick0').onclick=()=>$('#file').click();
$('#addMore').onclick=()=>$('#file').click();
$('#file').addEventListener('change',e=>{ if(e.target.files.length) addFiles(e.target.files); e.target.value=''; });
// compare button (press & hold)
const cmpBtn=$('#cmpBtn');
cmpBtn.addEventListener('pointerdown',()=>{st.cmp=true;renderPreview()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>cmpBtn.addEventListener(ev,()=>{st.cmp=false;renderPreview()}));
window.addEventListener('resize',()=>{ if(st.imgs.length) renderPreview(); });
</script>
