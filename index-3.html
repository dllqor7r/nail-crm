function handleSubmit(e){
  var form = e.target;
  if (!form || !form.id) return;

  /* 예약 */
  if (form.id === 'form-appt'){
    e.preventDefault();
    var fa = new FormData(form);
    var editId = form.getAttribute('data-id');
    var customerId = String(fa.get('customerId') || '');
    var guestName = String(fa.get('guestName') || '').trim();
    var guestPhone = String(fa.get('guestPhone') || '').trim();
    if (!customerId && !guestName){ toast('고객을 선택하거나 이름을 입력해 주세요'); return; }
    var date = String(fa.get('date') || '').trim();
    var time = String(fa.get('time') || '').trim();
    if (!date){ toast('날짜를 선택해 주세요'); return; }
    if (!time){ toast('시간을 입력해 주세요'); return; }
    var menu = String(fa.get('menu') || '').trim();
    var amount = Math.max(0, parseInt(fa.get('amount'), 10) || 0);
    var memo = String(fa.get('memo') || '').trim();

    var appt;
    if (editId){
      appt = state.appointments.filter(function(x){ return x.id === editId; })[0];
      if (!appt){ closeSheet(); return; }
      appt.customerId = customerId || null;
      appt.guestName = customerId ? appt.guestName : guestName;
      appt.guestPhone = customerId ? appt.guestPhone : guestPhone;
      appt.date = date; appt.time = time; appt.menu = menu; appt.amount = amount; appt.memo = memo;
    } else {
      appt = { id:uid(), customerId:customerId || null, guestName:guestName, guestPhone:guestPhone,
               date:date, time:time, menu:menu, amount:amount, memo:memo,
               status:'booked', recordId:null, createdAt:todayISO() };
      state.appointments.push(appt);
    }
    save();
    closeSheet();
    ui.selDate = date;
    ui.calY = parseISO(date).getFullYear();
    ui.calM = parseISO(date).getMonth();
    renderAll();
    toast(editId ? '예약을 저장했어요' : '예약을 등록했어요');
    return;
  }

  /* 고객 */
  if (form.id === 'form-customer'){
    e.preventDefault();
    var fd = new FormData(form);
    var name = String(fd.get('name') || '').trim();
    if (!name){ toast('이름을 입력해 주세요'); return; }
    var phone = String(fd.get('phone') || '').trim();
    var cycle = parseInt(fd.get('cycle'), 10) || 28;
    var memo = String(fd.get('memo') || '').trim();
    var cid = form.getAttribute('data-id');
    var cust = null, isNew = false;
    if (cid){
      cust = custById(cid);
      if (!cust){ closeSheet(); return; }
      cust.name = name; cust.phone = phone; cust.cycleDays = cycle; cust.memo = memo;
    } else {
      cust = { id:uid(), name:name, phone:phone, cycleDays:cycle, memo:memo, createdAt:todayISO(),
               membership:null, tags:[], noshow:0, vip:null, stamps:0 };
      state.customers.push(cust);
      isNew = true;
    }
    var tagStr = String(fd.get('tags') || '');
    cust.tags = tagStr.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    cust.noshow = Math.max(0, parseInt(fd.get('noshow'), 10) || 0);
    var vipv = String(fd.get('vip') || 'auto');
    cust.vip = vipv === 'yes' ? true : vipv === 'no' ? false : null;
    if (isNew && !cust.membership){
      var memType = String(fd.get('memType') || '');
      if (memType === 'amount'){
        var v = Math.max(0, parseInt(fd.get('memAmount'), 10) || 0);
        if (v > 0){
          cust.membership = { type:'amount', balance:v, openedAt:todayISO() };
          state.mlogs.push({ id:uid(), customerId:cust.id, date:todayISO(), action:'charge', type:'amount',
            value:v, amount:v, balanceAfter:v, memo:'회원권 신규 등록' });
        }
      } else if (memType === 'count'){
        var cnt = Math.max(0, parseInt(fd.get('memCount'), 10) || 0);
        var paid = Math.max(0, parseInt(fd.get('memPaid'), 10) || 0);
        if (cnt > 0){
          cust.membership = { type:'count', balance:cnt, openedAt:todayISO() };
          state.mlogs.push({ id:uid(), customerId:cust.id, date:todayISO(), action:'charge', type:'count',
            value:cnt, amount:paid, balanceAfter:cnt, memo:'회원권 신규 등록' });
        }
      }
    }
    save();
    closeSheet();
    renderAll();
    ui.detailId = cust.id;
    showDetail();
    toast(isNew ? '고객을 등록했어요' : '저장했어요');
    return;
  }

  /* 시술 기록 */
  if (form.id === 'form-record'){
    e.preventDefault();
    var f2 = new FormData(form);
    var custId = form.getAttribute('data-id');
    var apptRef = form.getAttribute('data-appt');
    var c2 = custById(custId);
    if (!c2){ closeSheet(); return; }
    var date2 = String(f2.get('date') || '') || todayISO();
    var menu2 = String(f2.get('menu') || '').trim();
    if (!menu2){ toast('시술 메뉴를 입력해 주세요'); return; }
    var amountRaw = f2.get('amount');
    if (amountRaw === null || String(amountRaw).trim() === ''){ toast('금액을 입력해 주세요'); return; }
    var amount2 = Math.max(0, parseInt(amountRaw, 10) || 0);
    var pay2 = String(f2.get('pay') || PAY_CARD);
    var rec = { id:uid(), customerId:c2.id, date:date2, menu:menu2, amount:amount2, pay:pay2,
                color:String(f2.get('color') || '').trim(),
                art:String(f2.get('art') || '').trim(),
                memo:String(f2.get('memo') || '').trim(),
                photo: window.__recPhoto || null };
    var usedValue = 0;

    if (pay2 === PAY_MEM){
      var m2 = c2.membership;
      if (!m2){ toast('회원권이 없어 차감할 수 없어요'); return; }
      usedValue = m2.type === 'amount' ? amount2 : 1;
      if (usedValue <= 0){ toast('차감할 금액을 입력해 주세요'); return; }
      if (m2.balance < usedValue){
        toast(m2.type === 'amount' ? ('정액권 잔액이 부족해요 (' + won(m2.balance) + ')')
                                   : ('남은 횟수가 부족해요 (' + m2.balance + '회)'));
        return;
      }
      m2.balance -= usedValue;
      var log2 = { id:uid(), customerId:c2.id, date:date2, action:'use', type:m2.type,
                   value:usedValue, amount:0, balanceAfter:m2.balance, memo:menu2 };
      state.mlogs.push(log2);
      rec.mlogId = log2.id;
    }

    var stamped = false;
    if (f2.get('stamp') && num(c2.stamps) < 10){ c2.stamps = num(c2.stamps) + 1; stamped = true; }
    state.records.push(rec);

    if (apptRef){
      var appt2 = state.appointments.filter(function(x){ return x.id === apptRef; })[0];
      if (appt2){ appt2.status = 'done'; appt2.recordId = rec.id; appt2.customerId = c2.id; }
    }

    save();
    closeSheet();
    renderAll();
    if (ui.tab === 'customers' && ui.detailId === c2.id) showDetail();

    var resRows = [['고객', esc(c2.name)], ['시술', esc(menu2)], ['금액', won(amount2)], ['스탬프', num(c2.stamps) + ' / 10']];
    var smsList = [{ label:'시술 후 관리법 문자', text: msgAftercare(c2, rec) }];
    var resTitle = '시술 기록 저장 완료';
    if (pay2 === PAY_MEM){
      var mm2 = c2.membership;
      resRows.push(['차감', mm2.type === 'amount' ? won(usedValue) : (usedValue + '회')]);
      resRows.push(['남은 ' + (mm2.type === 'amount' ? '잔액' : '횟수'),
        mm2.type === 'amount' ? won(mm2.balance) : (mm2.balance + '회')]);
      smsList.push({ label:'선불 잔액 안내 문자', text: msgUse(c2, mm2, usedValue) });
      resTitle = '선불 차감 완료';
    }
    showResult(resTitle, resRows, c2, smsList);
    return;
  }

  /* 선불 충전 */
  if (form.id === 'form-charge'){
    e.preventDefault();
    var f3 = new FormData(form);
    var c3 = custById(form.getAttribute('data-id'));
    if (!c3) return;
    var t3 = String(f3.get('memType') || 'amount');
    var value3 = 0, paid3 = 0;
    if (t3 === 'amount'){
      value3 = Math.max(0, parseInt(f3.get('value'), 10) || 0);
      paid3 = value3;
      if (value3 <= 0){ toast('충전 금액을 입력해 주세요'); return; }
    } else {
      value3 = Math.max(0, parseInt(f3.get('count'), 10) || 0);
      paid3 = Math.max(0, parseInt(f3.get('paid'), 10) || 0);
      if (value3 <= 0){ toast('충전 횟수를 입력해 주세요'); return; }
    }
    var m3 = c3.membership;
    if (!m3){ m3 = { type:t3, balance:0, openedAt:todayISO() }; c3.membership = m3; }
    m3.balance += value3;
    m3.expiresAt = String(f3.get('expires') || '').trim();
    state.mlogs.push({ id:uid(), customerId:c3.id, date:todayISO(), action:'charge', type:m3.type,
      value:value3, amount:paid3, balanceAfter:m3.balance, memo:'선불 충전' });
    save();
    closeSheet();
    renderAll();
    showResult('선불 충전 완료',
      [['충전', m3.type === 'amount' ? won(value3) : (value3 + '회')],
       ['남은 ' + (m3.type === 'amount' ? '잔액' : '횟수'), m3.type === 'amount' ? won(m3.balance) : (m3.balance + '회')]],
      c3, [{ label:'충전 안내 문자', text: msgCharge(c3, m3, value3) }]);
    return;
  }

  /* 선불 차감 */
  if (form.id === 'form-deduct'){
    e.preventDefault();
    var f4 = new FormData(form);
    var c4 = custById(form.getAttribute('data-id'));
    if (!c4 || !c4.membership) return;
    var m4 = c4.membership;
    var v4 = Math.max(0, parseInt(f4.get('value'), 10) || 0);
    if (v4 <= 0){ toast('차감할 ' + (m4.type === 'amount' ? '금액' : '횟수') + '을 입력해 주세요'); return; }
    if (m4.balance < v4){
      toast(m4.type === 'amount' ? ('잔액이 부족해요 (' + won(m4.balance) + ')')
                                 : ('남은 횟수가 부족해요 (' + m4.balance + '회)'));
      return;
    }
    m4.balance -= v4;
    state.mlogs.push({ id:uid(), customerId:c4.id, date:todayISO(), action:'use', type:m4.type,
      value:v4, amount:0, balanceAfter:m4.balance,
      memo:String(f4.get('memo') || '').trim() || '선불 차감' });
    save();
    closeSheet();
    renderAll();
    showResult('선불 차감 완료',
      [['차감', m4.type === 'amount' ? won(v4) : (v4 + '회')],
       ['남은 ' + (m4.type === 'amount' ? '잔액' : '횟수'), m4.type === 'amount' ? won(m4.balance) : (m4.balance + '회')]],
      c4, [{ label:'차감 안내 문자', text: msgUse(c4, m4, v4) }]);
    return;
  }

  /* 재고 */
  if (form.id === 'form-inv'){
    e.preventDefault();
    var f5 = new FormData(form);
    var nm = String(f5.get('name') || '').trim();
    if (!nm){ toast('품목명을 입력해 주세요'); return; }
    var itemId = form.getAttribute('data-id');
    var item = itemId ? state.inventory.filter(function(x){ return x.id === itemId; })[0] : null;
    var data = {
      name: nm,
      category: String(f5.get('category') || '').trim() || '기타',
      qty: Math.max(0, parseInt(f5.get('qty'), 10) || 0),
      unit: String(f5.get('unit') || '').trim() || '개',
      safety: Math.max(0, parseInt(f5.get('safety'), 10) || 0),
      memo: String(f5.get('memo') || '').trim()
    };
    if (item){ Object.assign(item, data); }
    else { state.inventory.push(Object.assign({ id:uid() }, data)); }
    save();
    closeSheet();
    renderAll();
    toast(item ? '품목을 저장했어요' : '품목을 등록했어요');
    return;
  }

  /* 설정 */
  if (form.id === 'form-settings'){
    e.preventDefault();
    var f6 = new FormData(form);
    state.settings.shopName = String(f6.get('shopName') || '').trim();
    state.settings.greeting = String(f6.get('greeting') || '').trim() || DEFAULT_SETTINGS.greeting;
    state.settings.signoff = String(f6.get('signoff') || '').trim();
    state.settings.aftercare = String(f6.get('aftercare') || '').trim() || DEFAULT_AFTERCARE;
    save();
    renderAll();
    toast('설정을 저장했어요');
    return;
  }

  /* 휴무 */
  if (form.id === 'form-closure'){
    e.preventDefault();
    var fc = new FormData(form);
    var ctype = String(fc.get('ctype') || 'weekly');
    var allDay = fc.get('allday') ? true : false;
    var rec2 = { id:uid(), type:ctype, allDay:allDay,
      start:String(fc.get('start') || '').trim(), end:String(fc.get('end') || '').trim(),
      reason:String(fc.get('reason') || '').trim() };
    if (ctype === 'weekly'){
      rec2.weekday = parseInt(fc.get('weekday'), 10) || 0;
    } else {
      rec2.date = String(fc.get('cdate') || '').trim();
      if (!rec2.date){ toast('날짜를 선택해 주세요'); return; }
    }
    if (!allDay && (!rec2.start || !rec2.end)){ toast('시작·종료 시간을 입력해 주세요'); return; }
    if (!allDay && rec2.start >= rec2.end){ toast('종료 시간이 시작보다 늦어야 해요'); return; }
    if (!rec2.reason) rec2.reason = allDay ? '휴무' : '마감';
    state.closures.push(rec2);
    save();
    closeSheet();
    renderAll();
    toast('휴무를 등록했어요');
    return;
  }

  /* 지출 */
  if (form.id === 'form-expense'){
    e.preventDefault();
    var fe = new FormData(form);
    var eid = form.getAttribute('data-id');
    var exp = eid ? state.expenses.filter(function(x){ return x.id === eid; })[0] : null;
    var edata = {
      date: String(fe.get('date') || '').trim() || todayISO(),
      category: String(fe.get('category') || '기타'),
      amount: Math.max(0, parseInt(fe.get('amount'), 10) || 0),
      memo: String(fe.get('memo') || '').trim()
    };
    if (!edata.amount){ toast('금액을 입력해 주세요'); return; }
    if (exp) Object.assign(exp, edata);
    else state.expenses.push(Object.assign({ id:uid() }, edata));
    save();
    closeSheet();
    renderAll();
    toast(exp ? '지출을 저장했어요' : '지출을 추가했어요');
    return;
  }

  /* 시술 메뉴 */
  if (form.id === 'form-menu'){
    e.preventDefault();
    var fm = new FormData(form);
    var mname = String(fm.get('name') || '').trim();
    if (!mname){ toast('메뉴명을 입력해 주세요'); return; }
    var mid = form.getAttribute('data-id');
    var menu = mid ? state.menus.filter(function(x){ return x.id === mid; })[0] : null;
    var mdata = {
      name: mname,
      price: Math.max(0, parseInt(fm.get('price'), 10) || 0),
      minutes: Math.max(0, parseInt(fm.get('minutes'), 10) || 0),
      category: String(fm.get('category') || '').trim() || '기타'
    };
    if (menu) Object.assign(menu, mdata);
    else state.menus.push(Object.assign({ id:uid() }, mdata));
    save();
    closeSheet();
    renderAll();
    openMenus();
    toast(menu ? '메뉴를 저장했어요' : '메뉴를 추가했어요');
    return;
  }
}

/* =========================================================
   이벤트
   ========================================================= */
function onAct(act, el){
  var id = el.getAttribute ? el.getAttribute('data-id') : null;
  switch (act){
    case 'tab': go(el.getAttribute('data-tab')); break;
    case 'open-cust':
      if (!id) break;
      ui.detailId = id; showDetail();
      break;
    case 'back': go('customers'); break;
    case 'new-cust': openCustomerForm(); break;
    case 'edit-cust': openCustomerForm(id); break;
    case 'del-cust': askDeleteCustomer(id); break;
    case 'add-record': openRecordForm(id); break;
    case 'del-record': askDeleteRecord(id); break;

    case 'cal-prev':
      ui.calM--;
      if (ui.calM < 0){ ui.calM = 11; ui.calY--; }
      renderCalendar();
      break;
    case 'cal-next':
      ui.calM++;
      if (ui.calM > 11){ ui.calM = 0; ui.calY++; }
      renderCalendar();
      break;
    case 'cal-today': {
      var t = new Date();
      ui.calY = t.getFullYear(); ui.calM = t.getMonth(); ui.selDate = todayISO();
      renderCalendar();
      break;
    }
    case 'cal-day':
      ui.selDate = el.getAttribute('data-date');
      renderCalendar();
      break;
    case 'new-appt': openAppointmentForm(null, el.getAttribute('data-date') || ui.selDate); break;
    case 'edit-appt': openAppointmentForm(id); break;
    case 'appt-del': askDeleteAppt(id); break;
    case 'appt-done': completeAppointment(id); break;
    case 'appt-noshow': markNoshow(id); break;
    case 'closures': openClosures(el.getAttribute('data-date')); break;
    case 'closure-del': {
      var cl = state.closures.filter(function(x){ return x.id === id; })[0];
      if (!cl) break;
      confirmSheet('휴무를 삭제할까요?', esc(cl.reason || '휴무') + ' 기록이 삭제돼요.', '삭제', function(){
        state.closures = state.closures.filter(function(x){ return x.id !== id; });
        save(); renderAll(); toast('삭제했어요');
      });
      break;
    }
    case 'expense-add': openExpenseForm(); break;
    case 'del-expense': {
      var ex = state.expenses.filter(function(x){ return x.id === id; })[0];
      if (!ex) break;
      confirmSheet('지출을 삭제할까요?', esc(ex.memo || ex.category) + ' · ' + won(ex.amount), '삭제', function(){
        state.expenses = state.expenses.filter(function(x){ return x.id !== id; });
        save(); renderAll(); toast('지출을 삭제했어요');
      });
      break;
    }
    case 'menus': openMenus(); break;
    case 'menu-add': openMenuForm(); break;
    case 'menu-edit': openMenuForm(id); break;
    case 'menu-del': {
      var mm = state.menus.filter(function(x){ return x.id === id; })[0];
      if (!mm) break;
      confirmSheet('메뉴를 삭제할까요?', esc(mm.name) + ' 메뉴가 목록에서 빠져요.', '삭제', function(){
        state.menus = state.menus.filter(function(x){ return x.id !== id; });
        save(); renderAll(); openMenus(); toast('메뉴를 삭제했어요');
      });
      break;
    }
    case 'photo-view': openPhoto(id); break;
    case 'photo-clear': {
      window.__recPhoto = null;
      var pv = $('rec-photo-prev');
      if (pv) pv.innerHTML = '';
      break;
    }
    case 'tag-pick': {
      var tf = el.closest('form');
      if (!tf) break;
      var th = tf.querySelector('[name="tags"]');
      if (!th) break;
      var tn = el.getAttribute('data-name');
      var arr = String(th.value || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var ti = arr.indexOf(tn);
      if (ti >= 0) arr.splice(ti, 1); else arr.push(tn);
      th.value = arr.join(',');
      el.classList.toggle('on', ti < 0);
      break;
    }
    case 'tag-add': {
      var tf2 = el.closest('form');
      if (!tf2) break;
      var inp = tf2.querySelector('[name="newTag"]');
      var val = String(inp ? inp.value : '').trim();
      if (!val) break;
      var th2 = tf2.querySelector('[name="tags"]');
      var arr2 = String(th2.value || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      if (arr2.indexOf(val) < 0) arr2.push(val);
      th2.value = arr2.join(',');
      var picker = tf2.querySelector('#tag-picker');
      if (picker){
        var found = false;
        picker.querySelectorAll('[data-act="tag-pick"]').forEach(function(n){
          if (n.getAttribute('data-name') === val){ n.classList.add('on'); found = true; }
        });
        if (!found){
          var nb = document.createElement('button');
          nb.type = 'button';
          nb.className = 'tag on';
          nb.setAttribute('data-act', 'tag-pick');
          nb.setAttribute('data-name', val);
          nb.textContent = val;
          picker.appendChild(nb);
        }
      }
      inp.value = '';
      break;
    }
    case 'stamp-plus':
    case 'stamp-minus': {
      var sc = custById(id);
      if (!sc) break;
      sc.stamps = Math.max(0, Math.min(10, num(sc.stamps) + (act === 'stamp-plus' ? 1 : -1)));
      save(); renderAll();
      break;
    }
    case 'stamp-reset': {
      var sc2 = custById(id);
      if (!sc2) break;
      confirmSheet('스탬프 10개를 사용할까요?', '서비스 사용으로 기록하고 스탬프를 0으로 초기화해요.', '사용 완료', function(){
        sc2.stamps = 0;
        save(); renderAll(); toast('스탬프를 초기화했어요');
      });
      break;
    }

    case 'charge': openCharge(id); break;
    case 'deduct': openDeduct(id); break;
    case 'mhistory': openHistory(id); break;
    case 'new-member': openCustomerPicker('member'); break;
    case 'pick-customer': openCustomerPicker('record'); break;
    case 'pick': {
      var mode = el.getAttribute('data-mode');
      closeSheet();
      if (mode === 'member') openCharge(id);
      else openRecordForm(id);
      break;
    }
    case 'filter': ui.filter = el.getAttribute('data-filter'); ui.limit = 30; renderCustomers(); break;
    case 'go-filter': ui.filter = el.getAttribute('data-filter'); ui.limit = 30; go('customers'); break;
    case 'more-cust': ui.limit += 30; renderCustList(); break;
    case 'pre-filter': ui.preFilter = el.getAttribute('data-filter'); renderPrepaid(); break;
    case 'inv-filter': ui.invFilter = el.getAttribute('data-filter'); renderInventory(); break;
    case 'inv-add': openInventoryForm(); break;
    case 'inv-edit': openInventoryForm(id); break;
    case 'inv-inc':
    case 'inv-dec': {
      var it = state.inventory.filter(function(x){ return x.id === id; })[0];
      if (!it) break;
      it.qty = Math.max(0, num(it.qty) + (act === 'inv-inc' ? 1 : -1));
      save();
      renderInventory();
      break;
    }
    case 'inv-del': {
      var del = state.inventory.filter(function(x){ return x.id === id; })[0];
      if (!del) break;
      confirmSheet('품목을 삭제할까요?', esc(del.name) + ' 재고 기록이 삭제돼요.', '삭제', function(){
        state.inventory = state.inventory.filter(function(x){ return x.id !== id; });
        save(); renderAll(); toast('품목을 삭제했어요');
      });
      break;
    }

    case 'settings': openSettings(); break;
    case 'export': exportJSON(); break;
    case 'import': {
      var f = $('file-import');
      if (!f){
        f = document.createElement('input');
        f.type = 'file'; f.id = 'file-import'; f.accept = '.json,application/json';
        f.setAttribute('hidden', '');
        document.body.appendChild(f);
      }
      f.click(); break;
    }
    case 'csv-import': { var fc = $('file-csv'); if (fc) fc.click(); break; }
    case 'csv-template': downloadCSVTemplate(); break;
    case 'csv-apply': applyCSV(window.__csvPending); break;
    case 'reset': openResetView(); break;
    case 'reset-confirm':
      state = blankState();
      save();
      ui.detailId = null;
      closeSheet();
      go('calendar');
      toast('모든 데이터를 비웠어요');
      break;
    case 'reset-seed': {
      var sd = readSeed();
      if (!sd){ toast('처음 데이터가 없어요'); break; }
      state = hydrate(sd);
      save();
      ui.detailId = null;
      closeSheet();
      go('calendar');
      toast('처음 가져온 데이터로 되돌렸어요');
      break;
    }
    case 'close': closeSheet(); break;

    case 'mcat-filter': {
      var formC = el.closest('form');
      if (!formC) break;
      var cat = el.getAttribute('data-cat');
      formC.querySelectorAll('.mcat-btn').forEach(function(b){
        b.classList.toggle('on', b.getAttribute('data-cat') === cat);
      });
      formC.querySelectorAll('[data-act="tag-toggle"]').forEach(function(b){
        b.style.display = (cat === 'ALL' || b.getAttribute('data-cat') === cat) ? '' : 'none';
      });
      break;
    }
    case 'tag-toggle': {
      var form = el.closest('form');
      if (!form) break;
      var tname = el.getAttribute('data-name');
      var price = parseInt(el.getAttribute('data-price'), 10) || 0;
      var menuInp = form.querySelector('[name="menu"]');
      var amtInp = form.querySelector('[name="amount"]');
      if (!menuInp) break;
      var parts = menuInp.value.split(/\s*\+\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
      var wasOn = el.classList.contains('on');
      if (wasOn){
        var idx = parts.indexOf(tname);
        if (idx >= 0) parts.splice(idx, 1);
        if (amtInp) amtInp.value = String(Math.max(0, (parseInt(amtInp.value, 10) || 0) - price));
        el.classList.remove('on');
      } else {
        parts.push(tname);
        if (amtInp) amtInp.value = String((parseInt(amtInp.value, 10) || 0) + price);
        el.classList.add('on');
      }
      menuInp.value = parts.join(' + ');
      break;
    }
    case 'fill': {
      var f2 = el.closest('form');
      if (!f2) break;
      var target = f2.querySelector('[name="' + el.getAttribute('data-target') + '"]');
      if (target){
        target.value = el.getAttribute('data-value');
        target.dispatchEvent(new Event('input', { bubbles:true }));
      }
      break;
    }
    default: break;
  }
}

function bindEvents(){
  document.addEventListener('click', function(e){
    var anchor = e.target.closest ? e.target.closest('a[href]') : null;
    var tgt = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!tgt) return;
    if (anchor && tgt.contains(anchor)) return; // tel: / sms: 는 OS에 맡김
    e.preventDefault();
    onAct(tgt.getAttribute('data-act'), tgt);
  }, false);

  document.addEventListener('submit', handleSubmit, false);

  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'q'){
      ui.q = e.target.value;
      ui.limit = 30;
      renderCustList();
    }
  }, false);

  document.addEventListener('change', function(e){
    var t = e.target;
    if (!t) return;
    if (t.name === 'memType'){
      var form = t.form || (t.closest ? t.closest('form') : null);
      syncMemUI(form);
    }
    if (t.name === 'customerId'){
      var f = t.form || (t.closest ? t.closest('form') : null);
      toggleGuestFields(f);
    }
    if (t.id === 'file-import') handleImport(t.files && t.files[0]);
    if (t.id === 'file-csv') handleCSV(t.files && t.files[0]);
    if (t.id === 'rec-photo'){
      var pf = t.files && t.files[0];
      if (pf) compressImage(pf, function(dataUrl){
        window.__recPhoto = dataUrl;
        var prev = $('rec-photo-prev');
        if (prev) prev.innerHTML = '<img src="' + dataUrl + '" alt="첨부 사진"><button type="button" class="photo-x" data-act="photo-clear">삭제</button>';
        var inp = $('rec-photo');
        if (inp) inp.value = '';
      });
    }
    if (t.name === 'allday'){
      var tr = t.form ? t.form.querySelector('.time-row') : null;
      if (tr) tr.style.display = t.checked ? 'none' : 'flex';
    }
    if (t.name === 'ctype'){
      var cf = t.form;
      if (cf){
        var isW = t.value === 'weekly';
        var wk = cf.querySelector('.wk-field'), dt = cf.querySelector('.dt-field');
        if (wk) wk.hidden = !isW;
        if (dt) dt.hidden = isW;
      }
    }
  }, false);

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeSheet();
  }, false);
}

/* =========================================================
   시작
   ========================================================= */
function readSeed(){
  try {
    var el = document.getElementById('seed-data');
    if (!el) return null;
    var raw = String(el.textContent || '').trim();
    if (!raw || raw === 'null') return null;
    return JSON.parse(raw);
  } catch (err){ return null; }
}
function hydrate(src){
  var st = blankState();
  st.settings = Object.assign({}, DEFAULT_SETTINGS, src.settings || {});
  st.customers = src.customers || [];
  st.records = src.records || [];
  st.mlogs = src.mlogs || [];
  st.appointments = src.appointments || [];
  st.inventory = src.inventory || [];
  st.expenses = src.expenses || [];
  st.closures = src.closures || [];
  st.kpi = src.kpi || null;
  if (src.menus && src.menus.length) st.menus = src.menus;
  return st;
}
function init(){
  var loaded = loadState();
  if (loaded){ state = loaded; }
  else {
    var seed = readSeed();
    state = seed ? hydrate(seed) : buildSample();
    save();
  }

  var n = new Date();
  ui.calY = n.getFullYear();
  ui.calM = n.getMonth();
  ui.selDate = todayISO();

  bindEvents();
  $('brand-sub').textContent = String(state.settings.shopName || '').trim() || '나만의 고객 관리';
  go('calendar');
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
