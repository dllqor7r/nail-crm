<style>
:root{
  --bg:#F6F7F8; --card:#FFFFFF; --line:#E5E7EB; --line-soft:#F2F3F5;
  --ink:#27272A; --ink-soft:#52525B; --ink-mute:#9CA3AF;
  --accent:#3F3F46; --accent-deep:#3F3F46; --accent-soft:#F2F3F5;
  --accent-2:#3F3F46; --surface-2:#F2F3F5;
  --warn:#9A7B3F; --warn-soft:#F6F0E4;
  --ok:#5C7A62; --ok-soft:#EAF0EA;
  --red:#A24B54; --red-soft:#F7EAEB;
  --sh:0 6px 18px rgba(39,39,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.45;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.app{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:linear-gradient(180deg,#FCFCFD 0%,#F6F7F8 100%);
  display:flex;flex-direction:column;position:relative;overflow-x:hidden;
}
/* header */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 11px;
  background:rgba(252,252,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(229,231,235,.8);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:30px;height:30px;flex:none;border-radius:9px}
.brand-title{font-size:15.5px;font-weight:800;letter-spacing:-.4px}
.brand-sub{font-size:10.5px;color:var(--ink-mute);margin-top:1px}
.top-acts{display:flex;gap:6px;flex:none}
.tbtn{height:32px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:#FFFFFF;font-size:11.5px;font-weight:700;color:var(--accent-2)}
.tbtn:active{background:var(--surface-2)}
/* layout */
main{flex:1;padding:14px 16px calc(92px + env(safe-area-inset-bottom,0px))}
.screen{display:none}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.pad{padding:14px}
.hint{font-size:11px;color:var(--ink-mute)}
.sec{margin-top:18px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 9px}
.sec-head h2{font-size:14px;font-weight:800;margin:0;letter-spacing:-.3px}
.sec-head .cnt{color:var(--accent-deep);font-weight:800;margin-left:2px}
.empty{background:#FFFFFF;border:1px dashed var(--line);border-radius:16px;padding:18px 14px;text-align:center;font-size:12.5px;color:var(--ink-mute);line-height:1.6}
.empty.big{padding:32px 16px;font-size:13px}
.empty span{font-size:11.5px;color:var(--ink-mute)}
/* home hero */
.hello{font-size:12px;color:var(--ink-soft);margin:2px 2px 8px}
.hero{position:relative;border-radius:22px;padding:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);letter-spacing:.2px}
.hero-pill{background:var(--accent-soft);color:var(--accent-deep);padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700}
.hero-amount{font-size:30px;font-weight:800;letter-spacing:-1.2px;margin:6px 0 2px;line-height:1.15;color:var(--accent-deep)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:13px;background:var(--surface-2);border-radius:14px;padding:9px 4px}
.hero-stats div{text-align:center}
.hero-stats span{display:block;font-size:9.5px;color:var(--ink-soft);margin-bottom:2px}
.hero-stats b{font-size:12.5px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.hero-btns{display:flex;gap:7px;margin-top:12px;position:relative;z-index:1}
.hero-btn{flex:1;height:44px;border:none;border-radius:13px;background:var(--accent-deep);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.2px;box-shadow:0 6px 14px rgba(39,39,42,.14)}
.hero-btn:active{background:#27272A}
.hero-btn.ghost{background:#fff;color:var(--accent-deep);border:1px solid var(--line);box-shadow:none}
.note-mini{font-size:10.5px;color:var(--ink-mute);margin:8px 3px 0}
.guide-card{margin:2px 0 12px;background:var(--accent-soft);border:1px solid #E5E7EB;border-radius:20px;padding:16px 16px 14px}
.guide-title{font-size:14.5px;font-weight:800;letter-spacing:-.3px;color:var(--accent-deep)}
.guide-text{font-size:12px;line-height:1.6;color:var(--ink-soft);margin:6px 0 12px}
.recharge-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;background:var(--accent-soft);border:1px solid #E5E7EB;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--accent-deep)}
.recharge-strip span{font-weight:800}
/* calendar */
.cal-card{padding:12px 12px 10px;margin-top:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
.cal-title{font-size:14.5px;font-weight:800;letter-spacing:-.4px}
.cal-nav{width:31px;height:31px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;color:var(--accent-2);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.cal-nav.today{width:auto;padding:0 10px;font-size:11px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dow{font-size:10px;color:var(--ink-mute);text-align:center;padding:5px 0;font-weight:800}
.cal-dow.sun{color:#B4575F}
.cal-dow.sat{color:#6B7280}
.cal-day{position:relative;border:none;background:transparent;border-radius:11px;padding:0;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink)}
.cal-day.out{color:#C4C7CC}
.cal-day.today{background:var(--accent-soft);color:var(--accent-deep);font-weight:800}
.cal-day.sel{background:var(--accent-2);color:#fff}
.cal-dots{display:flex;gap:2px;height:4px;margin-top:2px;align-items:center}
.cal-dots i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day.sel .cal-dots i{background:#F3F4F6}
.cal-day.today .cal-dots i{background:var(--accent-deep)}
/* appointment */
.day-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px}
.day-head h2{font-size:14px;font-weight:800;margin:0;letter-spacing:-.3px}
.day-head .sub{font-size:10.5px;color:var(--ink-mute);font-weight:600;margin-left:6px}
.day-rev{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;max-width:calc(100% - 6px);margin:-2px 3px 10px;padding:4px 9px;border-radius:9px;background:var(--accent-soft);font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:-.2px}
.day-rev b{font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.day-rev .plus{font-size:10.5px;font-weight:700;color:var(--ink-mute)}
.appt{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.appt-when{font-size:11.5px;font-weight:800;color:var(--accent-deep);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-memo{display:inline-block;max-width:100%;margin-top:6px;font-size:10.5px;font-weight:800;color:var(--ink-soft);background:var(--accent-soft);border-radius:7px;padding:2px 8px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-body{flex:1;min-width:0}
.appt-acts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.appt.done{opacity:.72}
.appt.canceled{opacity:.5}
.appt.noshow{opacity:.6}
/* 30-min timetable */
.view-tog{display:inline-flex;background:#F0F1F3;border-radius:9px;padding:2px;gap:2px}
.view-tog button{border:0;background:transparent;font-size:11px;font-weight:700;color:var(--ink-soft);padding:4px 8px;border-radius:7px}
.view-tog button.on{background:#fff;color:var(--accent-2);box-shadow:0 1px 3px rgba(39,39,42,.06)}
.tt-wrap{display:flex;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:8px}
.tt-times{width:62px;flex:none;background:#FAFAFB;border-right:1px solid var(--line-soft)}
.tt-tlabel{height:40px;padding:4px 6px 0 0;text-align:right;font-size:10px;font-weight:700;color:var(--ink-mute);border-bottom:1px solid var(--line-soft);box-sizing:border-box;letter-spacing:-.3px}
.tt-tlabel.hr{color:var(--ink-soft);font-weight:800}
.tt-grid{flex:1;position:relative;min-width:0}
.tt-slot{display:block;width:100%;height:40px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;padding:0;cursor:pointer;box-sizing:border-box}
.tt-slot.hr{border-bottom-style:dashed;border-bottom-color:#E5E7EB}
.tt-slot:active{background:#F4F5F6}
.tt-ev{position:absolute;left:5px;right:5px;border-radius:10px;padding:5px 8px;box-sizing:border-box;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:1px;border:1px solid #D1D5DB;background:#F2F3F5;border-left:3.5px solid var(--accent-2);z-index:2}
.tt-ev.done{background:#EEF7F2;border-color:#CDE6D7;border-left-color:var(--ok)}
.tt-ev.canceled,.tt-ev.noshow{background:#F3F4F6;border-color:#E5E7EB;border-left-color:#9CA3AF;opacity:.65}
.tt-ev-top{display:flex;align-items:center;gap:4px;flex-wrap:wrap;line-height:1.25}
.tt-ev-nm{font-size:12px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.tt-ev-badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px;background:#fff;color:var(--accent-2);border:1px solid #E5E7EB}
.tt-ev-badge.vip{background:#F3F4F6;color:#27272A;border-color:#E5E7EB}
.tt-ev-badge.st{background:#F2F3F5;color:#3F3F46;border-color:#E5E7EB}
.tt-ev-tm{font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-ev-memo{align-self:flex-start;display:block;max-width:100%;margin-top:2px;font-size:10px;font-weight:800;color:var(--ink-soft);background:#fff;border:1px solid #E5E7EB;border-radius:6px;padding:1px 6px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-ev-mmt{display:inline-block;margin-left:4px;font-size:9.5px;font-weight:800;color:var(--ink-soft);background:#fff;border:1px solid #E5E7EB;border-radius:5px;padding:0 4px;line-height:12px;letter-spacing:-.2px;vertical-align:1px;max-width:58%;overflow:hidden;text-overflow:ellipsis}
.tt-ev.short{padding:3px 6px;gap:0}
.tt-ev.short .tt-ev-top{line-height:1.1;flex-wrap:nowrap;overflow:hidden;flex:none}
.tt-ev.short .tt-ev-nm{font-size:11.5px}
.tt-ev.short .tt-ev-badge{font-size:9px;padding:0 4px;line-height:12px}
.tt-ev.short .tt-drag{font-size:11px}
.tt-ev.short .tt-ev-tm{font-size:9.5px;line-height:11px;margin-top:1px;flex:none}
.tt-ev.short .tt-ev-mmt{font-size:9px;line-height:10px;padding:0 3px;margin-left:3px;max-width:62%}
.tt-ev.short.has-memo .tt-ev-mn{display:none}
.tt-ev-mn{font-size:10.5px;color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-ev.dragging{box-shadow:0 8px 22px rgba(39,39,42,.22);z-index:10;opacity:.95;transform:scale(1.015)}
.tt-drag{margin-left:auto;font-size:13px;color:var(--ink-mute);padding:0 3px;line-height:1;touch-action:none;cursor:grab;user-select:none}
.tt-closure{position:absolute;left:0;right:0;background:repeating-linear-gradient(-45deg,rgba(63,63,70,.06),rgba(63,63,70,.06) 6px,transparent 6px,transparent 12px);border-top:1px solid #E5E7EB;border-bottom:1px solid #E5E7EB;z-index:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-mute);pointer-events:none}
/* stamp card */
.stampcard{margin-top:12px}
.stamp-head{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:9px}
.stamp-head b{font-size:13px;color:var(--ink);font-weight:800}
.stamp-head .full{color:var(--ok);font-weight:800}
.stamp-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.stamp{aspect-ratio:1/1;border-radius:50%;border:1px dashed #E5E7EB;background:#FAFAFB;display:flex;align-items:center;justify-content:center;font-size:10px;color:#C4C7CC}
.stamp.on{background:linear-gradient(140deg,#52525B,#3F3F46);border:1px solid #3F3F46;color:#fff;font-weight:800;box-shadow:0 3px 8px rgba(63,63,70,.18)}
.stamp-acts{display:flex;gap:6px;margin-top:11px}
.stamp-acts button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;font-size:11.5px;font-weight:800;color:var(--accent-2)}
.stamp-acts button.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff;flex:1.7}
.stamp-acts button:disabled{opacity:.4}
.stamp-badge{background:#F2F3F5;color:#3F3F46}
/* generic rows */
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--sh)}
.row:active{background:#FAFAFB}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px;flex:none}
.row-txt{flex:1;min-width:0}
.nm{font-size:14px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;letter-spacing:-.3px}
.meta{font-size:11px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-acts{display:flex;gap:5px;flex:none}
.mini{display:inline-flex;align-items:center;justify-content:center;height:31px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;color:var(--accent-2);font-size:11px;font-weight:700;text-decoration:none;letter-spacing:-.2px}
.mini.sms{background:var(--accent-soft);border-color:#E5E7EB;color:var(--accent-deep)}
.mini.primary{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.mini.warn{background:var(--warn-soft);border-color:#E9E0CC;color:var(--warn)}
.badge{font-size:10px;padding:3px 7px;border-radius:999px;font-weight:800;letter-spacing:-.1px;white-space:nowrap}
.st-due{background:var(--warn-soft);color:var(--warn)}
.st-dorm{background:#F3F4F6;color:#52525B}
.st-freq{background:var(--accent-soft);color:var(--accent-deep)}
.st-new{background:var(--ok-soft);color:var(--ok)}
.st-low{background:var(--red-soft);color:var(--red)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-off{background:#F3F4F6;color:#52525B}
/* customer list */
.screen-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.screen-head h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.6px}
.btn-add{height:34px;padding:0 13px;border-radius:12px;border:none;background:var(--accent-2);color:#fff;font-size:12.5px;font-weight:800;box-shadow:0 4px 10px rgba(39,39,42,.16)}
.searchbox{position:relative;margin-bottom:10px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-mute)}
#q{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px 0 37px;font-size:14px;outline:none;box-shadow:var(--sh);-webkit-appearance:none}
#q::placeholder{color:var(--ink-mute);font-size:13px}
#q:focus{border-color:#C4C7CC}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:-.2px}
.chip.on{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.ccard{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:9px;box-shadow:var(--sh)}
.ccard:active{background:#FAFAFB}
.ccard-main{flex:1;min-width:0}
.memline{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--accent-2);background:var(--surface-2);padding:3px 8px;border-radius:8px}
.chev{color:#C4C7CC;font-size:19px;line-height:1;flex:none;padding-right:2px}
/* detail */
.dhead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.dtitle{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.dtitle h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:#FFFFFF;font-size:17px;color:var(--accent-2);display:flex;align-items:center;justify-content:center;line-height:1}
.cline{font-size:14px;font-weight:700}
.btn-row{display:flex;gap:8px;margin-top:11px}
.btn-col{display:flex;flex-direction:column;gap:8px}
.memo{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-soft);line-height:1.6;white-space:pre-wrap}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 12px;box-shadow:var(--sh)}
.stat span{display:block;font-size:10.5px;color:var(--ink-soft);margin-bottom:3px}
.stat b{font-size:17px;font-weight:800;letter-spacing:-.6px}
.mcard{margin-top:12px;border-radius:19px;padding:15px 16px;color:#FAFAFA;background:linear-gradient(135deg,#52525B 0%,#3F3F46 100%);box-shadow:0 10px 22px rgba(39,39,42,.18)}
.mcard-top{display:flex;align-items:center;justify-content:space-between;font-size:11px;opacity:.85}
.mcard-bal{font-size:25px;font-weight:800;letter-spacing:-1px;margin:7px 0 1px}
.mcard-sub{font-size:10.5px;opacity:.78}
.mcard-acts{display:flex;gap:6px;margin-top:13px}
.mcard-acts button,.mcard-acts a{flex:1;height:34px;border-radius:10px;border:none;background:rgba(255,255,255,.17);color:#FAFAFA;font-size:11.5px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center}
.memb-empty{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-soft)}
.chip-add{height:30px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;font-size:11.5px;font-weight:800;color:var(--accent-2)}
.tl{margin-top:2px;position:relative;padding-left:16px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1.5px;background:linear-gradient(180deg,#E5E7EB,#F2F3F5)}
.tl-item{position:relative;margin-bottom:9px}
.tl-dot{position:absolute;left:-16px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #F6F7F8;box-sizing:content-box}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 12px;box-shadow:var(--sh)}
.tl-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl-top b{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.paytag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--line-soft);color:var(--accent-2)}
.tl-menu{font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.3px}
.tl-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tl-amt{font-size:13.5px;font-weight:800;color:var(--accent-deep);letter-spacing:-.3px}
.del{border:none;background:none;font-size:10.5px;color:#9CA3AF;font-weight:700;padding:4px 2px}
.tl-note{font-size:11.5px;color:var(--ink-mute);margin-top:6px;line-height:1.5}
.tl-right{display:inline-flex;align-items:center;gap:8px;flex:none}
.danger-zone{margin-top:20px}
/* customer detail tabs */
.prow{display:flex;align-items:center;gap:12px}
.pavatar{width:54px;height:54px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.pinfo{flex:1;min-width:0}
.pname{font-size:17px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pmeta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pacts{display:flex;gap:6px;margin-top:12px}
.pacts .btn{flex:1}
.ibtn{width:44px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--accent-deep);font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:var(--sh)}
.dtabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:16;display:flex;gap:1px;margin:14px -16px 12px;padding:0 12px;background:rgba(252,252,253,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex:none;border:none;background:none;padding:11px 9px 9px;font-size:12.5px;font-weight:800;color:var(--ink-mute);letter-spacing:-.4px;border-bottom:2px solid transparent;white-space:nowrap}
.dtab.on{color:var(--accent-deep);border-bottom-color:var(--accent-deep)}
.dbody{padding-bottom:8px}
.stat i{display:block;font-style:normal;font-size:10px;color:var(--ink-mute);margin-top:3px;font-weight:600}
.st-mem{background:#F2F3F5;color:#3F3F46}
.dacts{display:flex;gap:6px;margin-top:12px}
.dacts .btn{flex:1}
.cust-jump{width:100%;height:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid #E5E7EB;border-radius:12px;padding:11px 13px;margin-bottom:7px;text-align:left}
.cust-jump b{font-size:14.5px;font-weight:800;color:var(--accent-deep);letter-spacing:-.3px}
.cust-jump span{font-size:11px;font-weight:800;color:var(--accent-deep);white-space:nowrap}
/* prepaid */
.msum{padding:16px}
.msum-main span{font-size:11px;color:var(--ink-soft);display:block}
.msum-main b{font-size:25px;font-weight:800;letter-spacing:-1px;display:block;margin-top:3px}
.msum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.msum-grid div{text-align:center}
.msum-grid span{display:block;font-size:10px;color:var(--ink-soft)}
.msum-grid b{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.mrow{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:9px;box-shadow:var(--sh)}
.mrow.low{border-color:#EBD6D9;background:linear-gradient(180deg,#FDFDFD,#fff)}
.mrow-top{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:12px;transition:opacity .12s}
.mrow-top:active{opacity:.6}
.mrow-name{flex:1;min-width:0}
.mrow-bal{text-align:right}
.mrow-bal b{font-size:16px;font-weight:800;letter-spacing:-.5px;display:block;color:var(--accent-2)}
.mrow-bal span{font-size:9.5px;color:var(--ink-mute)}
.mrow-acts{display:flex;gap:5px;margin-top:10px}
.mrow-acts button,.mrow-acts a{flex:1;height:33px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;font-size:11.5px;font-weight:700;color:var(--accent-2);text-decoration:none;display:flex;align-items:center;justify-content:center;letter-spacing:-.2px}
.mrow-acts .primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.mrow-acts .sms{background:var(--accent-soft);border-color:#E5E7EB;color:var(--accent-deep)}
/* inventory */
.inv-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.inv-sum div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--sh)}
.inv-sum span{display:block;font-size:10px;color:var(--ink-soft)}
.inv-sum b{font-size:16px;font-weight:800;letter-spacing:-.4px}
.inv{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.inv.low{border-color:#EBD6D9;background:linear-gradient(90deg,#FBF1F2,#fff 60%)}
.inv.warn{border-color:#EDE4CF;background:linear-gradient(90deg,#FDFDFB,#fff 60%)}
.inv-main{flex:1;min-width:0}
.inv-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden}
.inv-meta{font-size:10.5px;color:var(--ink-mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:1px;flex:none;background:#F4F5F6;border:1px solid var(--line);border-radius:11px;padding:2px}
.stepper button{width:29px;height:29px;border:none;background:transparent;font-size:15px;font-weight:700;color:var(--accent-2);line-height:1;border-radius:8px}
.stepper button:active{background:var(--surface-2)}
.stepper b{min-width:30px;text-align:center;font-size:12.5px;font-weight:800;letter-spacing:-.3px}
/* analysis */
.chart-card{padding:15px 12px 10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:170px;padding-top:20px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bar-val{font-size:9.5px;color:var(--ink-mute);font-weight:700;height:12px}
.bar{width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#E5E7EB,#C4C7CC)}
.bar.on{background:linear-gradient(180deg,#52525B,#3F3F46)}
.bar-lab{font-size:10.5px;color:var(--ink-soft);font-weight:700;padding-top:3px}
.chart-note{font-size:10px;color:var(--ink-mute);text-align:right;margin-top:6px}
.ana-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ana{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;box-shadow:var(--sh)}
.ana span{font-size:10.5px;color:var(--ink-soft);display:block}
.ana b{font-size:18px;font-weight:800;letter-spacing:-.6px;display:block;margin-top:3px}
.ana small{font-size:10px;color:var(--ink-mute)}
.dist-bar{display:flex;height:13px;border-radius:999px;overflow:hidden;margin:12px 0 10px;background:var(--line-soft)}
.dist-bar i{display:block;height:100%}
.dist-legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.dist-legend div{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.rr-main span{font-size:11px;color:var(--ink-soft);display:block}
.rr-main b{font-size:24px;font-weight:800;letter-spacing:-.8px;display:block;margin:2px 0}
.rr-main small{font-size:11px;color:var(--ink-mute)}
.rr-bar{display:flex;height:13px;border-radius:999px;overflow:hidden;margin:12px 0 10px;background:var(--line-soft)}
.rr-bar i{display:block;height:100%}
.rr-legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.rr-legend div{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft)}
.rr-legend b{color:var(--ink)}
.rr-new{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);letter-spacing:-.2px}
.rr-new b{color:var(--accent-deep)}
.netsel{display:flex;gap:6px;align-items:center;margin:0 0 11px}
.pr-sel{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;font-family:inherit;padding:0 7px}
.rr-new span{font-size:10.5px;color:var(--ink-mute)}
.rr-main .rr-tag{display:inline-block;font-size:9.5px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px;letter-spacing:-.2px}
.rr-years{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rr-yrow{display:flex;align-items:center;gap:7px;width:100%;padding:5px 0;background:none;border:none;font-family:inherit;text-align:left}
.rr-yrow .yl{font-size:11px;font-weight:800;color:var(--ink-soft);width:34px;flex:none;letter-spacing:-.3px}
.rr-yrow.on .yl{color:var(--accent-deep)}
.rr-yrow .yb{flex:1;height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden;display:block}

function parseISO(s){

  if (kind === '이번 달') return [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(new Date(now.getFullYear(), now.getMonth() + 1, 0))];

function custById(id){ return state.customers.filter(function(c){ return c.id === id; })[0] || null; }
function recsOf(id){ return state.records.filter(function(r){ return r.customerId === id; }); }
function sortedRecs(id){
  return recsOf(id).slice().sort(function(a,b){
    if (a.date === b.date) return 0;
    return a.date < b.date ? 1 : -1;
  });
}
var _statCache = null;
function custStats(c){
  if (_statCache && _statCache[c.id]) return _statCache[c.id];
  var rs = recsOf(c.id).slice().sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var recVisits = rs.length;
  var recTotal = rs.reduce(function(s,r){ return s + num(r.amount); }, 0);
  var lastRec = recVisits ? rs[recVisits-1] : null;

  // 팅커뷰에서 가져온 누적 방문·매출은 집계값을 그대로 살린다
  var visits = Math.max(recVisits, num(c.baseVisits));
  var total = Math.max(recTotal, num(c.baseTotal));
  var lastDate = lastRec ? lastRec.date : null;
  if (c.lastVisit && (!lastDate || c.lastVisit > lastDate)) lastDate = c.lastVisit;
  var lastMenu = lastRec ? lastRec.menu : '';

  var avg = null;
  if (recVisits >= 2){
    var sum = 0;
    for (var i=1;i<recVisits;i++) sum += diffDays(rs[i-1].date, rs[i].date);
    avg = Math.round(sum / (recVisits - 1));
  } else if (visits >= 2 && lastDate && c.createdAt){
    var span = diffDays(c.createdAt, lastDate);
    if (span > 0) avg = Math.round(span / (visits - 1));
  }
  var st = { visits:visits, total:total, last:lastDate, lastMenu:lastMenu,
             daysSince: lastDate ? daysSince(lastDate) : null, avg:avg };
  if (!_statCache) _statCache = {};
  _statCache[c.id] = st;
  return st;
}
function statusKey(c){
  var st = custStats(c);
  if (!st.last) return 'fresh';
  if (st.visits <= 1) return 'fresh';
  if (st.daysSince >= 45) return 'dormant';
  var cyc = num(c.cycleDays) || 28;
  if (st.daysSince >= cyc - 3) return 'due';
  return 'frequent';
}
function memberLabel(c){
  var m = c.membership;
  if (!m) return '';
  return m.type === 'amount' ? ('정액권 ' + won(m.balance)) : ('횟수권 ' + m.balance + '회');
}
function isLowBalance(c){
  var m = c && c.membership;
  if (!m) return false;
  return m.type === 'amount' ? num(m.balance) <= LOW_AMOUNT : num(m.balance) <= LOW_COUNT;
}
function isVip(c){
  if (!c) return false;
  if (c.vip === true) return true;
  if (c.vip === false) return false;
  var st = custStats(c);
  return st.visits >= 8 || st.total >= 400000;
}
function daysToExpiry(m){
  if (!m || m.unlimited || !m.expiresAt) return null;
  return diffDays(todayISO(), m.expiresAt);
}
function expiryInfo(m){
  var d = daysToExpiry(m);
  if (d === null) return null;
  if (d < 0) return { label:'만료', cls:'st-low', days:d };
  if (d === 0) return { label:'오늘 만료', cls:'st-low', days:d };
  if (d <= 30) return { label:'만료 D-' + d, cls:'st-due', days:d };
  return { label:'D-' + d, cls:'st-ok', days:d };
}
function datePlusMonths(n){
  var d = new Date(); d.setMonth(d.getMonth() + n);
  return iso(d);
}
// 등록일 + 1년 (2월 29일 등록은 다음 해 2월 28일로)
function isLeapYear(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function addOneYear(s){
  var str = String(s || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return '';
  var d = parseISO(str);
  var y = d.getFullYear() + 1, mo = d.getMonth(), da = d.getDate();
  if (mo === 1 && da === 29 && !isLeapYear(y)) da = 28;
  return iso(new Date(y, mo, da));
}
// 고객별 마지막 선불 충전일 (앱 충전 기록 + 백업으로 들어온 선불 판매)
function chargeDatesMap(s){
  var map = {};
  function put(cid, date){
    if (!cid || !date) return;
    if (!map[cid] || date > map[cid]) map[cid] = date;
  }
  ((s && s.mlogs) || []).forEach(function(l){ if (l && l.action === 'charge') put(l.customerId, l.date); });
  var k = s && s.kpi;
  if (k && k.prepaidSales) k.prepaidSales.forEach(function(x){ if (x) put(x.customerId, x.date); });
  return map;
}
// 선불권 등록일·유효기간 보정: 마지막 충전일 기준 1년
function syncPrepaidDates(customers, charges){
  var map = charges || {};
  var n = 0;
  (customers || []).forEach(function(c){
    var m = c && c.membership;
    if (!m) return;
    if (m.unlimited) return;   // 팅커뷰 '무제한' 선불권은 유효기간을 만들지 않는다
    var op = String(m.openedAt || '');
    var last = map[c.id] || '';
    if (last && last > op){          // 마지막 충전이 등록일보다 뒤 → 등록일·유효기간 모두 그 날짜 기준으로
      var e1 = addOneYear(last);
      if (m.openedAt !== last || (e1 && m.expiresAt !== e1)){
        m.openedAt = last;
        if (e1) m.expiresAt = e1;
        n++;
      }
      return;
    }
    if (!m.expiresAt && op){         // 유효기간이 비어 있으면 등록일 + 1년
      var e2 = addOneYear(op);
      if (e2){ m.expiresAt = e2; n++; }
    }
  });
  return n;
}
function lowBalanceCustomers(){
  return state.customers.filter(isLowBalance).sort(function(a,b){
    var x = a.membership.type === 'amount' ? a.membership.balance / LOW_AMOUNT : a.membership.balance / LOW_COUNT;
    var y = b.membership.type === 'amount' ? b.membership.balance / LOW_AMOUNT : b.membership.balance / LOW_COUNT;
    return x - y;
  });
}
function revenueIn(start, end){
  var key = String(start).slice(0,7);
  var k = state.kpi;
  var asOf = (k && k.asOf) ? k.asOf : null;
  var sum = (k && k.monthly && k.monthly[key] !== undefined) ? num(k.monthly[key]) : 0;
  state.records.forEach(function(r){
    if (r.date < start || r.date > end || r.pay === PAY_MEM) return;
    if (asOf && r.date <= asOf) return; // 집계에 이미 포함된 기간
    sum += num(r.amount);
  });
  state.mlogs.forEach(function(l){
    if (l.action !== 'charge' || l.date < start || l.date > end) return;
    if (asOf && l.date <= asOf) return;
    sum += num(l.amount);
  });
  return sum;
}
function monthRevenue(y, m){
  var key = y + '-' + pad(m);
  var k = state.kpi;
  var asOf = (k && k.asOf) ? k.asOf : null;
  var sum = (k && k.monthly && k.monthly[key] !== undefined) ? num(k.monthly[key]) : 0;
  var start = key + '-01', end = key + '-' + pad(new Date(y, m, 0).getDate());
  state.records.forEach(function(r){
    if (r.date < start || r.date > end || r.pay === PAY_MEM) return;
    if (asOf && r.date <= asOf) return;
    sum += num(r.amount);
  });
  state.mlogs.forEach(function(l){
    if (l.action !== 'charge' || l.date < start || l.date > end) return;
    if (asOf && l.date <= asOf) return;
    sum += num(l.amount);
  });
  return sum;
}
// 하루 매출: 기간별 매출 조회·월 결산과 같은 기준 — 시술 실결제(net) + 선불권·정기권 신규 충전
// 선불 차감(회원권 차감)은 충전할 때 이미 매출로 잡히므로 빼고 센다.
// 2026-01-01 이전은 월 단위 결산만 있어 날짜별로 나눌 수 없다 → null
var DAY_SALES_FROM = '2026-01-01';
function salesOnDay(date){
  if (String(date) < DAY_SALES_FROM) return null;
  var rec = 0, chg = 0;
  state.records.forEach(function(r){
    if (r.date !== date) return;
    if (r.net === undefined || r.net === null){
      rec += (r.pay === PAY_MEM) ? 0 : num(r.amount);
    } else {
      rec += num(r.net);
    }
  });
  state.mlogs.forEach(function(l){
    if (l.action === 'charge' && l.date === date) chg += num(l.amount);
  });
  if (state.kpi && state.kpi.prepaidSales){
    state.kpi.prepaidSales.forEach(function(x){
      if (x.date === date) chg += num(x.net);
    });
  }
  return { total: rec + chg, rec: rec, charge: chg };
}

function tidyMsgText(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/\r\n?/g, '\n')
    .split('\n')
    .map(function(line){ return line.replace(/[ \t]+/g, ' ').trim(); })
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/^\n+|\n+$/g, '');
}

function calendarCard(){
  if (!ui.calY){ var n = new Date(); ui.calY = n.getFullYear(); ui.calM = n.getMonth(); }
  var y = ui.calY, m = ui.calM;
  var first = new Date(y, m, 1);
  var startDow = first.getDay();
  var daysIn = new Date(y, m+1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var cells = [];
  for (var i = startDow - 1; i >= 0; i--) cells.push({ d: prevDays - i, out:true });
  for (var d = 1; d <= daysIn; d++) cells.push({ d:d, out:false, date: iso(new Date(y, m, d)) });
  var trail = (7 - (cells.length % 7)) % 7;
  for (var t2 = 1; t2 <= trail; t2++) cells.push({ d:t2, out:true });

  var today = todayISO();
  var grid = cells.map(function(cell, idx){
    if (cell.out) return '<div class="cal-day out">' + cell.d + '</div>';
    var cnt = apptCount(cell.date, false);
    var isToday = cell.date === today;
    var isSel = cell.date === ui.selDate;
    var closed = isClosedDate(cell.date);
    var dots = '';
    if (cnt > 0){
      var n = Math.min(cnt, 3);
      dots = '<span class="cal-dots">';
      for (var k=0;k<n;k++) dots += '<i></i>';
      dots += '</span>';
    } else {
      dots = '<span class="cal-dots"></span>';
    }
    return '<button class="cal-day ' + (closed ? 'closed ' : '') + (isToday ? 'today ' : '') + (isSel ? 'sel' : '') + '" data-act="cal-day" data-date="' + cell.date + '">' +
      '<span>' + cell.d + '</span>' + (closed ? '<span class="cal-holiday">휴무</span>' : dots) + '</button>';
  }).join('');

  var dows = WEEK.map(function(w, i){
    return '<div class="cal-dow ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>';
  }).join('');

  return '<div class="card cal-card">' +
    '<div class="cal-head">' +
      '<button class="cal-nav" data-act="cal-prev" aria-label="이전 달">‹</button>' +
      '<div class="cal-title">' + y + '년 ' + (m+1) + '월</div>' +
      '<div style="display:flex;gap:5px">' +
        '<button class="cal-nav today" data-act="cal-today">오늘</button>' +
        '<button class="cal-nav" data-act="cal-next" aria-label="다음 달">›</button>' +
      '</div>' +
    '</div>' +
    '<div class="cal-grid">' + dows + grid + '</div>' +
  '</div>';
}

function timeToMin(hhmm){
  if (!hhmm || hhmm.indexOf(':') < 0) return -1;
  var p = hhmm.split(':');
  var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  if (isNaN(h) || isNaN(m)) return -1;
  return h * 60 + m;
}
function minToHHMM(m){
  var h = Math.floor(m / 60), mm = m % 60;
  return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm;
}
function fmtKoreanTime(m){
  var h = Math.floor(m / 60), mm = m % 60;
  var ap = h < 12 ? '오전' : '오후';
  var h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
  return ap + ' ' + (h12 < 10 ? '0' : '') + h12 + ':' + (mm < 10 ? '0' : '') + mm;
}
function apptMinutes(a){
  if (num(a.minutes) > 0) return num(a.minutes);
  if (a.menu && state.menus && state.menus.length){
    var parts = a.menu.split(/\s*\+\s*/).map(function(s){ return s.trim(); }).filter(Boolean);
    var sum = 0;
    parts.forEach(function(p){
      var hit = state.menus.filter(function(m){
        return m.name === p || (m.name + '(' + (m.category || m.cat || '') + ')') === p;
      })[0];
      if (hit && num(hit.minutes) > 0) sum += num(hit.minutes);
    });
    if (sum > 0) return sum;
  }
  return 60;
}

function dayTimetable(date, list){
  var startM = 10 * 60, endM = 21 * 60 + 30;
  list.forEach(function(a){
    var s = timeToMin(a.time);
    if (s >= 0){
      var e = s + apptMinutes(a);
      if (s < startM) startM = Math.floor(s / 30) * 30;
      if (e > endM) endM = Math.ceil(e / 30) * 30;
    }
  });
  var slots = [];
  for (var m = startM; m < endM; m += 30) slots.push(m);
  var slotH = 40;

  var timesHtml = slots.map(function(m){
    var isHr = (m % 60 === 0);
    return '<div class="tt-tlabel ' + (isHr ? 'hr' : '') + '">' + fmtKoreanTime(m) + '</div>';
  }).join('');

  var bgHtml = slots.map(function(m){
    var isHr = (m % 60 === 0);
    return '<button type="button" class="tt-slot ' + (isHr ? 'hr' : '') + '" data-act="new-appt-at" data-date="' + date + '" data-time="' + minToHHMM(m) + '" aria-label="' + minToHHMM(m) + ' 예약 추가"></button>';
  }).join('');

  var closuresHtml = closureFor(date).map(function(cl){
    var cs = cl.allDay ? startM : timeToMin(cl.start);
    var ce = cl.allDay ? endM : timeToMin(cl.end);
    if (cs < 0 || ce <= cs) return '';
    var top = Math.max(0, ((cs - startM) / 30) * slotH);
    var h = Math.max(20, ((Math.min(endM, ce) - Math.max(startM, cs)) / 30) * slotH);
    return '<div class="tt-closure" style="top:' + top + 'px;height:' + h + 'px">' + esc(cl.reason || (cl.allDay ? '휴무' : '예약 마감')) + '</div>';
  }).join('');

  var evHtml = list.map(function(a){
    var s = timeToMin(a.time);
    if (s < 0) return '';
    var dur = apptMinutes(a);
    var top = ((s - startM) / 30) * slotH + 2;
    var h = Math.max(36, (dur / 30) * slotH - 4);
    var c = a.customerId ? custById(a.customerId) : null;
    var name = apptName(a);
    var badges = '';
    if (c && c.membership && c.membership.type === 'amount' && num(c.membership.balance) > 0){
      badges += '<span class="tt-ev-badge">선불 ' + won(c.membership.balance) + '</span>';
    } else if (c && c.membership && c.membership.type === 'count' && num(c.membership.balance) > 0){
      badges += '<span class="tt-ev-badge">' + num(c.membership.balance) + '회</span>';
    }
    if (c && c.vip) badges += '<span class="tt-ev-badge vip">VIP</span>';
    if (a.status === 'done') badges += '<span class="tt-ev-badge st">완료</span>';
    else if (a.status === 'noshow') badges += '<span class="tt-ev-badge">노쇼</span>';
    else if (a.status === 'canceled') badges += '<span class="tt-ev-badge">취소</span>';
    var timeRange = fmtKoreanTime(s) + ' - ' + fmtKoreanTime(s + dur);
    var memo = apptMemo(a);
    var shortCard = h < 66;   // 30·45분 카드는 시간 줄에 인라인으로 (카드 높이를 늘리지 않는다)
    return '<div class="tt-ev ' + a.status + (shortCard ? (' short' + (memo ? ' has-memo' : '')) : '') + '" data-act="edit-appt" data-id="' + a.id + '" data-start="' + s + '" data-dur="' + dur + '" data-gstart="' + startM + '" data-gend="' + endM + '" style="top:' + top + 'px;height:' + h + 'px">' +
      '<div class="tt-ev-top"><span class="tt-ev-nm">' + esc(name) + '</span>' + badges + '<span class="tt-drag" title="끌어서 시간 이동">⠿</span></div>' +
      '<div class="tt-ev-tm"><span class="tt-ev-tmr">' + esc(timeRange) + '</span>' +
        ((memo && shortCard) ? '<span class="tt-ev-mmt">📝 ' + esc(memo) + '</span>' : '') + '</div>' +
      (a.menu ? '<div class="tt-ev-mn">' + esc(a.menu) + '</div>' : '') +
      ((memo && !shortCard) ? '<div class="tt-ev-memo">📝 ' + esc(memo) + '</div>' : '') +
    '</div>';
  }).join('');

  return '<div class="tt-wrap">' +
    '<div class="tt-times">' + timesHtml + '</div>' +
    '<div class="tt-grid" style="height:' + (slots.length * slotH) + 'px">' + bgHtml + closuresHtml + evHtml + '</div>' +
  '</div>';
}

          '<button type="button" class="' + (isTT ? 'on' : '') + '" data-act="day-view" data-v="timetable">시간표</button>' +

      '</div></div>' + revLine + body;
}
function closureCards(date){
  var list = closureFor(date);
  if (!list.length) return '';
  return list.map(function(c){
    var time = c.allDay ? '종일' : ((c.start || '') + '–' + (c.end || ''));
    return '<div class="closure"><b>' + (c.allDay ? '휴무' : '마감') + '</b><span>' + esc(time) +

      '<div class="meta">' + esc(a.menu || '메뉴 미정') + (num(a.amount) ? (' · ' + won(a.amount)) : '') + '</div>' +
      (apptMemo(a) ? '<div class="appt-memo">📝 ' + esc(apptMemo(a)) + '</div>' : '') +

function sectionCustomers(title, list, hint, filter){
  if (!state.customers.length){
    return '<section class="sec"><div class="sec-head"><h2>' + title + '</h2></div>' +
      '<div class="empty big">아직 등록된 고객이 없어요<br><span>고객 탭에서 첫 고객을 등록해 보세요</span></div></section>';
  }
  var shown = list.slice(0, 4);
  var body = shown.length ? shown.map(custRow).join('') : '<div class="empty">지금 챙길 고객이 없어요 🌿</div>';

    ? '<button class="chip-add" data-act="go-filter" data-filter="' + esc(filter) + '">전체 ' + list.length + '명 보기</button>'
    : '<span class="hint">' + hint + '</span>';
  return '<section class="sec"><div class="sec-head"><h2>' + title + ' <span class="cnt">' + list.length + '</span></h2>' +
    right + '</div>' + body + '</section>';

function custRow(c){
  var st = custStats(c), k = statusKey(c);
  var meta = st.last ? ((num(c.cycleDays)||28) + '일 주기 · ' + st.daysSince + '일 전 방문') : '방문 기록 없음';

    acts += '<a class="mini" href="' + esc(telHref(c.phone)) + '">전화</a>';

  return '<div class="row" data-act="open-cust" data-id="' + c.id + '" role="button" tabindex="0">' +
    '<div class="avatar">' + esc((c.name||'?').slice(0,1)) + '</div>' +
    '<div class="row-txt">' +
      '<div class="nm">' + esc(c.name) + ' <span class="badge ' + STATUS[k].cls + '">' + STATUS[k].label + '</span>' +

      '<div class="meta">' + esc(meta) + (st.lastMenu ? (' · ' + esc(st.lastMenu)) : '') + '</div>' +

function renderCustomers(){

    '<div class="searchbox">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
        '<circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg>' +
      '<input id="q" type="search" placeholder="이름 · 연락처 · 메모 검색" value="' + esc(ui.q) + '" autocomplete="off">' +
    '</div>' +
    '<div class="chips" id="filters">' +
      filters.map(function(f){
        return '<button class="chip ' + (ui.filter === f ? 'on' : '') + '" data-act="filter" data-filter="' + f + '">' + f + '</button>';
      }).join('') +
    '</div>' +
    '<div class="chips" style="margin:-5px 0 12px">' +
      ['기본','매출 큰순','선불 큰순','선불 작은순','방문 많은순'].map(function(sf){
        return '<button class="chip ' + (ui.custSort === sf ? 'on' : '') + '" data-act="cust-sort" data-sort="' + sf + '">' + sf + '</button>';
      }).join('') +
    '</div>' +
    '<div id="cust-list"></div>';
  renderCustList();
}
function renderCustList(){
  var box = $('cust-list');
  if (!box) return;
  if (!state.customers.length){
    box.innerHTML = '<div class="empty big">아직 고객이 없어요<br><span>오른쪽 위 ＋ 신규로 첫 고객을 등록해 보세요</span></div>';
    return;
  }
  var q = ui.q.trim().toLowerCase();
  var list = state.customers.slice();
  if (ui.filter === '선불') list = list.filter(function(c){ return !!c.membership; });
  else if (ui.filter === '재방문 도래') list = list.filter(function(c){ return statusKey(c) === 'due'; });
  else if (ui.filter === '휴면') list = list.filter(function(c){ return statusKey(c) === 'dormant'; });
  if (q){
    list = list.filter(function(c){
      return [c.name, c.phone, c.memo].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  if (ui.custSort === '매출 큰순'){
    list.sort(function(a,b){ return custStats(b).total - custStats(a).total; });
  } else if (ui.custSort === '선불 큰순' || ui.custSort === '선불 작은순'){
    function memBal(c){ return c.membership ? num(c.membership.balance) : -1; }
    list.sort(function(a,b){
      var ba = memBal(a), bb = memBal(b);
      if (ui.custSort === '선불 큰순') return bb - ba;
      if (ba < 0 && bb < 0) return 0;
      if (ba < 0) return 1;
      if (bb < 0) return -1;
      return ba - bb;
    });
  } else if (ui.custSort === '방문 많은순'){
    list.sort(function(a,b){ return custStats(b).visits - custStats(a).visits; });
  } else {
    var order = { due:0, dormant:1, fresh:2, frequent:3 };
    list.sort(function(a,b){
      var oa = order[statusKey(a)], ob = order[statusKey(b)];
      if (oa !== ob) return oa - ob;
      return (custStats(b).daysSince || -1) - (custStats(a).daysSince || -1);
    });
  }
  if (!list.length){ box.innerHTML = '<div class="empty">조건에 맞는 고객이 없어요</div>'; return; }
  var shown = list.slice(0, ui.limit);
  var html = shown.map(custCard).join('');
  if (list.length > shown.length){
    html += '<button class="btn ghost" data-act="more-cust" style="margin:2px 0 10px">더 보기 · ' +
      (list.length - shown.length) + '명 남음</button>';
  }
  box.innerHTML = html;
}
function custCard(c){
  var st = custStats(c), k = statusKey(c);
  var mem = memberLabel(c);
  return '<div class="ccard" data-act="open-cust" data-id="' + c.id + '" role="button" tabindex="0">' +
    '<div class="avatar">' + esc((c.name||'?').slice(0,1)) + '</div>' +
    '<div class="ccard-main">' +
      '<div class="nm">' + esc(c.name) + ' <span class="badge ' + STATUS[k].cls + '">' + STATUS[k].label + '</span>' +

/* =========================================================
   고객 상세 (탭: 이용 정보 · 이용 기록 · 매출 · 예약 · 선불액)
   ========================================================= */
var DETAIL_TABS = [
  { key:'info',    label:'이용 정보' },
  { key:'history', label:'이용 기록' },
  { key:'sales',   label:'매출' },
  { key:'appts',   label:'예약' },
  { key:'prepaid', label:'선불액' }
];
function apptState(a){
  if (a.status === 'done') return { label:'이용완료', cls:'st-ok' };
  if (a.status === 'noshow') return { label:'노쇼', cls:'st-noshow' };
  if (a.status === 'canceled') return { label:'취소', cls:'st-off' };
  return { label:'예약확정', cls:'st-due' };
}
function dotDate(s){
  if (!s) return '—';
  return String(s).slice(0,10).replace(/-/g, '.');
}
function apptsOf(id){
  return state.appointments.filter(function(a){ return a.customerId === id; });
}
function mlogsOf(id){
  return state.mlogs.filter(function(l){ return l.customerId === id; });
}
function statCard(label, value, sub){
  return '<div class="stat"><span>' + label + '</span><b>' + value + '</b>' +
    (sub ? '<i>' + sub + '</i>' : '') + '</div>';
}

function renderDetail(){
  var box = $('screen-detail');

               (isVip(c) ? '<span class="badge st-vip">VIP</span>' : '') +
               (num(c.noshow) > 0 ? '<span class="badge st-noshow">노쇼 ' + num(c.noshow) + '</span>' : '');

    '</div>' +

      '<div class="prow">' +
        '<div class="pavatar">' + esc((c.name || '?').slice(0,1)) + '</div>' +
        '<div class="pinfo">' +
          '<div class="pname">' + esc(c.name) + '</div>' +

          '<div class="pmeta">' + esc(c.phone || '연락처 없음') + '</div>' +
        '</div>' +

      (c.memo ? '<div class="memo">' + esc(c.memo) + '</div>' : '') +

function detailBody(c, tab){
  if (tab === 'history') return dHistoryTab(c);
  if (tab === 'sales') return dSalesTab(c);
  if (tab === 'appts') return dApptTab(c);
  if (tab === 'prepaid') return dPrepaidTab(c);
  return dInfoTab(c);
}

/* ---------- 이용 정보 ---------- */
function dInfoTab(c){
  var st = custStats(c);
  var recs = recsOf(c.id);
  var firstVisit = '';
  recs.forEach(function(r){ if (r.date && (!firstVisit || r.date < firstVisit)) firstVisit = r.date; });
  if (c.lastVisit && (!firstVisit || c.lastVisit < firstVisit)) firstVisit = c.lastVisit;
  var avgSale = st.visits ? Math.round(st.total / st.visits) : 0;
  var recCnt = recs.length;
  return '<div class="stat-grid">' +
      statCard('최근 방문일', st.last ? dotDate(st.last) : '기록 없음',
               st.last ? (st.daysSince + '일 경과') : '') +
      statCard('평균 방문 주기', st.avg ? ('약 ' + st.avg + '일') : '—',
               st.avg ? '기록 ' + recCnt + '건 기준' : '기록이 더 쌓이면 계산돼요') +
      statCard('총 방문 / 노쇼', st.visits + '회 / ' + num(c.noshow) + '회', '누적 기준') +
      statCard('최초 방문일', firstVisit ? dotDate(firstVisit) : '—', '등록 ' + dotDate(c.createdAt)) +
      statCard('누적 실매출', won(st.total), '권장 주기 ' + (num(c.cycleDays) || 28) + '일') +
      statCard('평균 매출', won(avgSale), '방문 1회 기준') +
    '</div>' +
    stampCard(c) +
    (c.phone
      ? '<div class="dacts" style="margin-top:10px"><a class="btn sub ghost" href="' +
          esc(smsHref(c.phone, msgAftercare(c, sortedRecs(c.id)[0]))) + '">관리법 문자 보내기</a></div>'
      : '') +
    '<div class="danger-zone"><button class="btn ghost danger" data-act="del-cust" data-id="' + c.id + '">고객 삭제</button></div>';
}

/* ---------- 이용 기록 (예약 · 시술 · 선불 타임라인) ---------- */
function dHistoryTab(c){
  var items = [];
  recsOf(c.id).forEach(function(r){ items.push({ date:r.date, time:'', type:'record', r:r }); });
  apptsOf(c.id).forEach(function(a){ items.push({ date:a.date, time:a.time || '', type:'appt', a:a }); });
  mlogsOf(c.id).forEach(function(l){ items.push({ date:l.date, time:'', type:'mlog', l:l }); });
  items.sort(function(x, y){
    var d = String(y.date || '').localeCompare(String(x.date || ''));
    if (d !== 0) return d;
    return String(y.time || '').localeCompare(String(x.time || ''));
  });
  if (!items.length){
    return '<div class="empty">아직 이용 기록이 없어요<br><span>시술등록으로 첫 기록을 남겨 보세요</span></div>';
  }
  return '<div class="tl">' + items.map(dHistoryItem).join('') + '</div>';
}
function dHistoryItem(it){
  if (it.type === 'record'){
    var r = it.r;
    var notes = [ r.color ? ('컬러 ' + r.color) : '', r.art ? ('아트 ' + r.art) : '', r.memo || '' ]
      .filter(Boolean).join(' · ');
    return '<div class="tl-item"><span class="tl-dot"></span>' +
      '<div class="tl-card">' +
        '<div class="tl-top"><b>' + dateLabel(r.date) + '</b><span class="paytag">시술</span></div>' +
        '<div class="tl-menu">' + esc(r.menu) + '</div>' +
        '<div class="tl-bottom"><span class="tl-amt">' + won(r.amount) + '</span>' +
          '<span class="tl-right"><span class="hint">' + esc(r.pay || '') + '</span>' +
          '<button class="del" data-act="del-record" data-id="' + r.id + '">삭제</button></span></div>' +
        (notes ? '<div class="tl-note">' + esc(notes) + '</div>' : '') +
        (r.photo ? '<img class="tl-photo" src="' + esc(r.photo) + '" alt="시술 사진" data-act="photo-view" data-id="' + r.id + '">' : '') +
      '</div></div>';
  }
  if (it.type === 'appt'){
    var a = it.a, s = apptState(a);
    return '<div class="tl-item"><span class="tl-dot"></span>' +
      '<div class="tl-card" data-act="edit-appt" data-id="' + a.id + '">' +
        '<div class="tl-top"><b>' + dateLabel(a.date) + (a.time ? (' · ' + esc(a.time)) : '') + '</b>' +
          '<span class="badge ' + s.cls + '">' + s.label + '</span></div>' +
        '<div class="tl-menu">' + esc(a.menu || '메뉴 미정') + '</div>' +
        '<div class="tl-bottom"><span class="tl-amt">' + (num(a.amount) ? won(a.amount) : '금액 미정') + '</span>' +
          '<span class="hint">예약' + (a.status === 'booked' ? ' · 탭해서 수정' : '') + '</span></div>' +
      '</div></div>';
  }
  var l = it.l, isCh = l.action === 'charge';
  var val = l.type === 'amount'
    ? ((isCh ? '+' : '−') + won(l.value))
    : ((isCh ? '+' : '−') + l.value + '회');
  return '<div class="tl-item"><span class="tl-dot"></span>' +
    '<div class="tl-card">' +
      '<div class="tl-top"><b>' + dateLabel(l.date) + '</b>' +
        '<span class="paytag">' + (isCh ? '선불 충전' : '선불 차감') + '</span></div>' +
      '<div class="tl-menu">' + esc(l.memo || (isCh ? '선불 충전' : '선불 차감')) + '</div>' +
      '<div class="tl-bottom"><span class="tl-amt">' + val + '</span>' +
        '<span class="hint">잔여 ' + (l.type === 'amount' ? won(l.balanceAfter) : l.balanceAfter + '회') + '</span></div>' +
    '</div></div>';
}

/* ---------- 매출 ---------- */
function dSalesTab(c){
  var recs = sortedRecs(c.id);
  var total = recs.reduce(function(s, r){ return s + num(r.amount); }, 0);
  var cnt = recs.length;
  var avg = cnt ? Math.round(total / cnt) : 0;
  var st = custStats(c);
  var sum = '<div class="msum card">' +
      '<div class="msum-main"><span>누적 실매출액</span><b>' + won(st.total) + '</b></div>' +
      '<div class="msum-grid">' +
        '<div><span>매출 건수</span><b>' + cnt + '건</b></div>' +
        '<div><span>평균 매출</span><b>' + won(avg) + '</b></div>' +
        '<div><span>방문 횟수</span><b>' + st.visits + '회</b></div>' +
      '</div>' +
    '</div>';
  if (!recs.length) return sum + '<div class="empty">아직 매출 기록이 없어요<br><span>시술등록을 하면 매출로 잡혀요</span></div>';

function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 480;
      var w = img.width, h = img.height;
      if (w > max || h > max){
        var scale = Math.min(max / w, max / h);
        w = Math.round(w * scale); h = Math.round(h * scale);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.65));
    };
    img.onerror = function(){ toast('사진을 읽을 수 없어요'); };
    img.src = String(reader.result);
  };
  reader.onerror = function(){ toast('사진을 읽을 수 없어요'); };
  reader.readAsDataURL(file);
}

/* =========================================================
   매출 분석
   ========================================================= */
function renderAnalysis(){
  var months = [];
  for (var i=5;i>=0;i--) months.push(monthBounds(-i));
  // 데이터가 전혀 없는 앞쪽 달은 접어서 실제 데이터 구간만 보여준다
  while (months.length > 2){
    var m0 = months[0];
    var hasRec = state.records.some(function(r){ return r.date >= m0.start && r.date <= m0.end; });
    var hasLog = state.mlogs.some(function(l){ return l.date >= m0.start && l.date <= m0.end && num(l.amount) > 0; });
    if (revenueIn(m0.start, m0.end) || expenseTotal(m0.start, m0.end) || hasRec || hasLog) break;
    months.shift();
  }
  var revs = months.map(function(m){ return revenueIn(m.start, m.end); });
  var exps = months.map(function(m){ return expenseTotal(m.start, m.end); });
  var nets = revs.map(function(r,i){ return r - exps[i]; });
  var max = Math.max.apply(null, revs.concat([1]));
  var li = months.length - 1;

function go(tab){
  ui.tab = tab;
  ui.detailId = null;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  var sc = $('screen-' + tab);
  if (sc) sc.classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('on', t.getAttribute('data-tab') === tab);
  });
  if (tab === 'calendar') renderCalendar();
  else if (tab === 'customers') renderCustomers();
  else if (tab === 'prepaid') renderPrepaid();
  else if (tab === 'inventory') renderInventory();
  else if (tab === 'analysis') renderAnalysis();
  window.scrollTo(0,0);
}
function showDetail(){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  var sc = $('screen-detail');
  if (sc) sc.classList.add('active');
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('on', t.getAttribute('data-tab') === 'customers');
  });
  renderDetail();
  window.scrollTo(0,0);
}
function renderAll(){
  $('brand-sub').textContent = String(state.settings.shopName || '').trim() || '나만의 고객 관리';
  renderCalendar();
  renderCustomers();
  renderPrepaid();
  renderInventory();
  renderAnalysis();
  if (ui.detailId && custById(ui.detailId)) renderDetail();
}

  document.documentElement.style.overflow = 'hidden';

/* 메뉴 등록 데이터는 category, 예전 데이터·백업은 cat 을 쓴다 */
var MENU_CAT_ORDER = ['손','발','추가','속눈썹','눈썹','입술','기타'];
function menuCat(t){ return (t && (t.category || t.cat)) || '기타'; }
function menuCatSort(a, b){
  var ia = MENU_CAT_ORDER.indexOf(a), ib = MENU_CAT_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
}
function menuTagLabel(t, dupNames){
  var label = t.name;
  var cat = menuCat(t);
  if (dupNames[t.name] && label.indexOf(cat) < 0){
    label = label + '(' + cat + ')';
  }
  return label;
}

/* 탭마다 몇 개가 선택돼 있는지 배지로 갱신 */
function refreshMenuTabCounts(form){
  if (!form) return;
  var byCat = {};
  form.querySelectorAll('[data-act="tag-toggle"].on').forEach(function(b){
    var c = b.getAttribute('data-cat') || '기타';
    byCat[c] = (byCat[c] || 0) + 1;
  });
  form.querySelectorAll('.mcat-n').forEach(function(s){
    var n = byCat[s.getAttribute('data-cat')] || 0;
    s.textContent = n ? String(n) : '';
    s.style.display = n ? '' : 'none';
  });
}

function tagChips(selectedNames){
  var list = state.menus || [];
  var counts = {};
  var cats = [];
  list.forEach(function(t){
    counts[t.name] = (counts[t.name] || 0) + 1;
    var c = menuCat(t);
    if (cats.indexOf(c) < 0) cats.push(c);
  });
  cats.sort(menuCatSort);
  var dupNames = {};
  Object.keys(counts).forEach(function(k){ if (counts[k] > 1) dupNames[k] = true; });

  var sel = selectedNames || [];
  var rows = list.map(function(t){
    var label = menuTagLabel(t, dupNames);
    return {
      label: label,
      cat: menuCat(t),
      price: num(t.price),
      on: sel.indexOf(label) >= 0 || (!dupNames[t.name] && sel.indexOf(t.name) >= 0)
    };
  });

  var selCats = {};
  rows.forEach(function(r){ if (r.on) selCats[r.cat] = (selCats[r.cat] || 0) + 1; });

  var multi = cats.length > 1;
  /* 고른 메뉴가 있으면 '전체'에서 열어 어떤 파트를 골랐든 선택된 칩이 바로 보이게 */
  var initCat = !multi ? 'ALL' : (sel.length ? 'ALL' : cats[0]);

  var tabs = multi
    ? '<div class="mcat-tabs">' +
        cats.map(function(c){
          var n = selCats[c] || 0;
          return '<button type="button" class="mcat-btn' + (c === initCat ? ' on' : '') + '" data-act="mcat-filter" data-cat="' + esc(c) + '">' + esc(c) +
            '<span class="mcat-n" data-cat="' + esc(c) + '"' + (n ? '' : ' style="display:none"') + '>' + (n || '') + '</span></button>';
        }).join('') +
        '<button type="button" class="mcat-btn' + (initCat === 'ALL' ? ' on' : '') + '" data-act="mcat-filter" data-cat="ALL">전체</button>' +
      '</div>'
    : '';

  return tabs + '<div class="tags">' + rows.map(function(r, i){
    var hide = (multi && initCat !== 'ALL' && r.cat !== initCat) ? ' style="display:none"' : '';
    return '<button type="button" class="tag ' + (r.on ? 'on' : '') + '" data-act="tag-toggle" data-idx="' + i + '" data-cat="' + esc(r.cat) + '" data-name="' + esc(r.label) + '" data-price="' + r.price + '"' + hide + '>' +
      esc(r.label) + '<span class="p">' + (r.price ? wonShort(r.price) : '0') + '</span></button>';
  }).join('') + '</div>';
}

/* 지출 기본 날짜: 분석 탭에서 보고 있는 달이면 그 달 날짜로 (아니면 오늘) */
function netMonthDate(){
  var now = new Date();
  var y = Number(ui.netY) || now.getFullYear();
  var m = Number(ui.netM) || (now.getMonth() + 1);
  if (y === now.getFullYear() && m === (now.getMonth() + 1)) return todayISO();
  var last = new Date(y, m, 0).getDate();
  return y + '-' + pad(m) + '-' + pad(Math.min(now.getDate(), last));
}

/* ---------- 선불 이력 ---------- */
function openHistory(custId){
  var c = custById(custId);
  if (!c) return;
  var logs = state.mlogs.filter(function(l){ return l.customerId === custId; })
    .sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var rows = logs.length ? logs.map(function(l){
    var isCharge = l.action === 'charge';
    var valText = isCharge ? (l.type === 'amount' ? ('+' + won(l.value)) : ('+' + l.value + '회'))
                           : (l.type === 'amount' ? ('-' + won(l.value)) : ('-' + l.value + '회'));

    return '<div class="logrow">' +
      '<span class="logtag ' + (isCharge ? 'charge' : 'use') + '">' + (isCharge ? '충전' : '사용') + '</span>' +

      '<div class="logamt">' + valText + '<span>잔여 ' + balText + '</span></div>' +

    '<div class="sheet-grip"></div>' +

/* 지금 보고 있는 화면 파일이 언제 것인지 (서버 Last-Modified 기준) */
function appUpdatedLabel(){
  var t = Date.parse(document.lastModified || '');
  if (!t || isNaN(t)) return '확인할 수 없어요';
  var d = new Date(t);
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
/* 화면만 새로 받아온다 — localStorage(고객·예약 데이터)는 건드리지 않는다 */
function reloadAppFresh(){
  var url = location.pathname + '?v=' + Date.now();
  var moved = false;
  var go = function(){
    if (moved) return;
    moved = true;
    location.replace(url);
  };
  try {
    // iOS 홈 화면 웹앱은 HTML 을 오래 캐시한다 → 새 URL 로 한 번 강제로 받아 둔 뒤 이동
    fetch(url, { cache: 'reload' }).then(go, go);
    setTimeout(go, 2500);
  } catch (e){ go(); }
}

/* ---------- 백업 ---------- */
function exportJSON(){
  try {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'nail-crm-backup-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('백업 파일을 내보냈어요');
  } catch (err){ toast('내보내기에 실패했어요'); }
}
function handleImport(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(String(reader.result));
      if (!data || !Array.isArray(data.customers) || !Array.isArray(data.records)) throw new Error('format');

        var next = blankState();
        next.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
        next.customers = data.customers.filter(function(c){ return c && c.id; });
        next.records = data.records.filter(function(r){ return r && r.id; });
        next.mlogs = Array.isArray(data.mlogs) ? data.mlogs : [];
        next.appointments = Array.isArray(data.appointments) ? data.appointments : [];
        next.inventory = Array.isArray(data.inventory) ? data.inventory : [];
        next.expenses = Array.isArray(data.expenses) ? data.expenses : [];
        next.closures = Array.isArray(data.closures) ? data.closures : [];
        next.kpi = (data.kpi && typeof data.kpi === 'object') ? data.kpi : null;
        if (Array.isArray(data.menus) && data.menus.length) next.menus = data.menus;
        syncPrepaidDates(next.customers, chargeDatesMap(next));
        state = next;
        save();

        toast('백업을 불러왔어요 (고객 ' + state.customers.length + '명)');
      });
    } catch (err){ toast('백업 파일을 읽을 수 없어요'); }
  };
  reader.readAsText(file);
}

/* ---------- CSV ---------- */
function parseCSV(text){
  var rows = [], row = [], cur = '', inQ = false;
  for (var i=0; i<text.length; i++){
    var ch = text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i+1] === '"'){ cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ','){ row.push(cur); cur = ''; }
      else if (ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch === '\r'){ /* skip */ }
      else cur += ch;
    }
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}
function decodeCSV(buf){
  var text = '';
  try { text = new TextDecoder('utf-8', { fatal:true }).decode(buf); }
  catch (e1){
    try { text = new TextDecoder('euc-kr').decode(buf); }
    catch (e2){ text = new TextDecoder('utf-8').decode(buf); }
  }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text;
}
function csvNumber(v){
  var s = String(v || '').replace(/[^0-9.\-]/g, '');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
var CSV_HEADERS = {
  name: ['이름','성명','고객명','고객','name'],
  phone: ['연락처','전화','전화번호','휴대폰','휴대폰번호','핸드폰','phone','mobile'],
  memo: ['메모','특이사항','비고','note','memo'],
  balance: ['잔액','금액','선불잔액','회원권잔액','balance','선불'],
  count: ['횟수','잔여횟수','남은횟수','회원권횟수','count'],
  cycle: ['주기','재방문주기','권장주기','cycle']
};
function findCol(headers, keys){
  for (var i=0; i<headers.length; i++){
    var h = String(headers[i] || '').replace(/\s/g,'').toLowerCase();
    for (var j=0; j<keys.length; j++){
      if (h === String(keys[j]).toLowerCase()) return i;
    }
  }
  return -1;
}
function handleCSV(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var text = decodeCSV(reader.result);
      var rows = parseCSV(text);
      if (!rows.length){ toast('CSV에 내용이 없어요'); return; }
      var header = rows[0].map(function(h){ return String(h).trim(); });
      var cols = {
        name: findCol(header, CSV_HEADERS.name),
        phone: findCol(header, CSV_HEADERS.phone),
        memo: findCol(header, CSV_HEADERS.memo),
        balance: findCol(header, CSV_HEADERS.balance),
        count: findCol(header, CSV_HEADERS.count),
        cycle: findCol(header, CSV_HEADERS.cycle)
      };
      var hasHeader = cols.name >= 0 || cols.phone >= 0;
      if (!hasHeader){ cols = { name:0, phone:1, memo:2, balance:3, count:-1, cycle:-1 }; }
      var body = hasHeader ? rows.slice(1) : rows;
      var parsed = [], skipped = 0;
      body.forEach(function(r){
        var name = String(r[cols.name] || '').trim();
        if (!name){ skipped++; return; }
        parsed.push({
          name: name,
          phone: cols.phone >= 0 ? String(r[cols.phone] || '').trim() : '',
          memo: cols.memo >= 0 ? String(r[cols.memo] || '').trim() : '',
          balance: cols.balance >= 0 ? csvNumber(r[cols.balance]) : 0,
          count: cols.count >= 0 ? Math.floor(csvNumber(r[cols.count])) : 0,
          cycle: cols.cycle >= 0 ? Math.floor(csvNumber(r[cols.cycle])) : 28
        });
      });
      if (!parsed.length){ toast('가져올 고객을 찾지 못했어요'); return; }

      var dup = 0;
      parsed.forEach(function(p){
        var exists = state.customers.some(function(c){
          return p.phone ? digits(c.phone) === digits(p.phone) : c.name === p.name;
        });
        if (exists) dup++;
      });

      var preview = parsed.slice(0,6).map(function(p){
        return '<div class="csv-row"><b>' + esc(p.name) + '</b><span>' + esc(p.phone || '연락처 없음') +
          (p.balance > 0 ? (' · 잔액 ' + won(p.balance)) : p.count > 0 ? (' · ' + p.count + '회') : '') + '</span></div>';
      }).join('');

      openSheet(
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-head"><h3>CSV 고객 가져오기</h3><button class="x" data-act="close" aria-label="닫기">✕</button></div>' +
        '<p class="sheet-sub">' + parsed.length + '명을 찾았어요' +
          (dup ? (' · 이미 등록된 ' + dup + '명은 건너뛰어요') : '') +
          (skipped ? (' · 이름 없는 ' + skipped + '줄 제외') : '') + '</p>' +
        '<div class="card pad" style="margin-bottom:14px">' + preview +
          (parsed.length > 6 ? '<div class="csv-row" style="color:var(--ink-mute)">외 ' + (parsed.length - 6) + '명</div>' : '') +
        '</div>' +
        '<div class="btn-col">' +
          '<button class="btn primary" type="button" data-act="csv-apply">' + parsed.length + '명 가져오기</button>' +
          '<button class="btn ghost" data-act="close">취소</button>' +
        '</div>'
      );
      window.__csvPending = parsed;
    } catch (err){ toast('CSV를 읽을 수 없어요'); }
  };
  reader.readAsArrayBuffer(file);
}
function applyCSV(rows){
  if (!rows || !rows.length) return;
  var added = 0, dup = 0;
  rows.forEach(function(p){
    var exists = state.customers.some(function(c){
      return p.phone ? digits(c.phone) === digits(p.phone) : c.name === p.name;
    });
    if (exists){ dup++; return; }
    var c = { id:uid(), name:p.name, phone:p.phone, cycleDays:p.cycle || 28,
              memo:p.memo, createdAt:todayISO(), membership:null, tags:[], noshow:0, vip:null, stamps:0 };
    if (p.balance > 0){
      c.membership = { type:'amount', balance:p.balance, openedAt:todayISO(), expiresAt:addOneYear(todayISO()) };
      state.mlogs.push({ id:uid(), customerId:c.id, date:todayISO(), action:'charge', type:'amount',
        value:p.balance, amount:p.balance, balanceAfter:p.balance, memo:'CSV 가져오기' });
    } else if (p.count > 0){
      c.membership = { type:'count', balance:p.count, openedAt:todayISO(), expiresAt:addOneYear(todayISO()) };
      state.mlogs.push({ id:uid(), customerId:c.id, date:todayISO(), action:'charge', type:'count',
        value:p.count, amount:0, balanceAfter:p.count, memo:'CSV 가져오기' });
    }
    state.customers.push(c);
    added++;
  });
  save();
  renderAll();
  closeSheet();
  toast(added + '명을 가져왔어요' + (dup ? (' (중복 ' + dup + '명 제외)') : ''));
}
function downloadCSVTemplate(){
  var rows = [
    ['이름','연락처','메모','회원권 잔액','잔여 횟수','권장 주기'],
    ['홍길동','연락처를 입력하세요','예시 메모 · 지우고 쓰세요','100000','','28'],
    ['김예시','연락처를 입력하세요','횟수권 예시','','10','21']
  ];
  var csv = '\ufeff' + rows.map(function(r){
    return r.map(function(cell){ return '"' + String(cell).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'nail-crm-customers.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('CSV 양식을 내려받았어요');
}
